version: "3.9"

services:
  trader:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
      - ./models:/app/models
    command: ["python", "-m", "app.main", "--config", "/app/config/config.yaml", "trade"]
    ports:
      - "8001:8001"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    command: ["python", "-m", "app.main", "--config", "/app/config/config.yaml", "api"]
    ports:
      - "8002:8000"
    restart: unless-stopped

  learner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
      - ./models:/app/models
    command: ["python", "-m", "app.main", "--config", "/app/config/config.yaml", "online-train"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.1.4
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3002:3000"
    restart: unless-stopped

  backtest-gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    profiles: ["gpu"]
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
    command: ["python3", "-m", "app.main", "--config", "/app/config/config.yaml", "backtest"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
