version: "3.9"

services:
  trader:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./config:/app/config
      - ./data:/data
      - ./models:/app/models
    command: ["python3", "-m", "app.main", "--config", "/app/config/config.yaml", "trade"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    ports:
      - "0.0.0.0:8001:8001"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    command: ["python", "-m", "app.main", "--config", "/app/config/config.yaml", "api"]
    ports:
      - "0.0.0.0:18081:8000"
    restart: unless-stopped

  learner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
      - ./models:/app/models
    command: ["python", "-m", "app.main", "--config", "/app/config/config.yaml", "online-train"]
    restart: unless-stopped

  learner-gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    profiles: ["gpu"]
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./config:/app/config
      - ./data:/data
      - ./models:/app/models
    command: ["python3", "-m", "app.main", "--config", "/app/config/config.yaml", "online-train"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    restart: unless-stopped

  calendar-updater:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    command:
      [
        "python",
        "-m",
        "app.utils.holiday_update",
        "--config",
        "/app/config/config.yaml"
      ]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "0.0.0.0:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "0.0.0.0:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.1.4
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "0.0.0.0:3002:3000"
    restart: unless-stopped

  backtest-gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    profiles: ["gpu"]
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
    command: ["python3", "-m", "app.main", "--config", "/app/config/config.yaml", "backtest"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
