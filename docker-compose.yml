version: "3.9"

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "0.0.0.0:6379:6379"
    labels:
      - "autoheal=true"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # Wait for trader to be healthy before starting: ensures CUDA is fully
    # initialised by trader before Ollama competes for VRAM on this 6 GB GPU.
    # Also removes the fixed-sleep hack that was previously needed.
    depends_on:
      trader:
        condition: service_healthy
    environment:
      - OLLAMA_KEEP_ALIVE=24h  # Keep model loaded in memory; don't unload after 5-min default
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - "0.0.0.0:11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama ps > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  trader:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - ./config:/app/config
      - ./data:/data
      - ./models:/app/models
    command: ["python3", "-m", "app.main", "--config", "/app/config/config.yaml", "trade"]
    ports:
      - "0.0.0.0:8001:8001"
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, os, time; urllib.request.urlopen('http://localhost:8001/metrics', timeout=10); cp='/data/checkpoints/trader.json'; age=time.time()-os.path.getmtime(cp) if os.path.exists(cp) else 0; assert age < 900, f'Loop stale {age:.0f}s'\""]
      interval: 30s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    restart: unless-stopped

  market-cache:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
    command: ["python", "-m", "app.data.market_cache_service", "--config", "/app/config/config.yaml"]
    depends_on:
      - redis
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    labels:
      - "autoheal=true"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    command: ["python", "-m", "app.main", "--config", "/app/config/config.yaml", "api"]
    ports:
      - "0.0.0.0:18081:8000"
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  learner:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-}
    volumes:
      - ./config:/app/config
      - ./data:/data
      - ./models:/app/models
    command: ["python3", "-m", "app.main", "--config", "/app/config/config.yaml", "online-train"]
    labels:
      - "autoheal=true"
    restart: unless-stopped

  learner-gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    profiles: ["gpu"]
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - ./config:/app/config
      - ./data:/data
      - ./models:/app/models
    command: ["python3", "-m", "app.main", "--config", "/app/config/config.yaml", "online-train"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    restart: unless-stopped

  calendar-updater:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    command:
      [
        "python",
        "-m",
        "app.utils.holiday_update",
        "--config",
        "/app/config/config.yaml"
      ]
    labels:
      - "autoheal=true"
    restart: unless-stopped

  healthwatch:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - docker-socket-proxy
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ./config:/app/config
      - ./data:/data
    command: ["python", "-m", "app.monitoring.healthwatch", "--config", "/app/config/config.yaml"]
    expose:
      - "9105"
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9105/metrics', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  daily-report:
    build:
      context: .
      dockerfile: docker/Dockerfile.light
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./alertmanager/alertmanager.generated.yml:/app/alertmanager/alertmanager.yml
      - ./data:/data
    command: ["python", "-m", "app.reporting.daily_top_movers", "--config", "/app/config/config.yaml"]
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "autoheal=true"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "0.0.0.0:9090:9090"
    labels:
      - "autoheal=true"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.generated.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "0.0.0.0:9094:9093"
    labels:
      - "autoheal=true"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.1.4
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "0.0.0.0:3002:3000"
    labels:
      - "autoheal=true"
    restart: unless-stopped

  backtest-gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    profiles: ["gpu"]
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
    command: ["python3", "-m", "app.main", "--config", "/app/config/config.yaml", "backtest"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  health-reporter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - docker-socket-proxy
      - trader
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ./config:/app/config
      - ./data:/data
    command:
      [
        "python",
        "/app/scripts/health_report.py",
        "--config",
        "/app/config/config.yaml"
      ]
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  data-pruner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./data:/data
    command:
      [
        "python",
        "/app/scripts/prune_old_data.py",
        "--data-dir", "/data",
        "--retention-days", "7",
        "--interval-hours", "24"
      ]
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  tests-when-closed:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
    command:
      [
        "python",
        "/app/scripts/run_tests_when_closed.py",
        "--config",
        "/app/config/config.yaml",
        "--interval-minutes",
        "15"
      ]
    labels:
      - "autoheal=true"
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal
    depends_on:
      - docker-socket-proxy
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - DOCKER_SOCK=tcp://docker-socket-proxy:2375
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    environment:
      - CONTAINERS=1
      - POST=1
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
