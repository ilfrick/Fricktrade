global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: autotrader
    metrics_path: /metrics
    static_configs:
      - targets: ["trader:8001"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
