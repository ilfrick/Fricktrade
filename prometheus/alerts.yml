groups:
  - name: autotrader
    rules:
      - alert: TraderDown
        expr: up{job="autotrader"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Trader metrics endpoint down"
          description: "Prometheus cannot scrape trader metrics."
      - alert: OrderFailures
        expr: increase(orders_skipped_total{reason="order_failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order failures detected"
          description: "Order failures observed in the last 15 minutes."
      - alert: OrderRejected
        expr: sum by (broker, symbol, side, code, reason) (increase(order_rejects_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order rejected by broker"
          description: "Broker {{ $labels.broker }} rejected {{ $labels.side }} {{ $labels.symbol }} (code={{ $labels.code }}, reason={{ $labels.reason }})."
      - alert: OpenOrdersStuck
        expr: max_over_time(open_orders[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Open orders stuck"
          description: "Open orders present for over 30 minutes."
      - alert: BrokerApiErrorRate
        expr: |
          sum by (broker) (rate(broker_requests_total{status="error"}[10m]))
          /
          sum by (broker) (rate(broker_requests_total[10m]))
          > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Broker API error rate elevated"
          description: "Broker {{ $labels.broker }} has >20% error rate over 10m."
      - alert: BrokerApiNoSuccess
        expr: time() - max_over_time(broker_last_success_timestamp_seconds[10m]) > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No successful broker API calls"
          description: "No successful broker calls observed in 10m."
      - alert: ServiceDown
        expr: healthwatch_service_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service down"
          description: "Healthwatch cannot reach {{ $labels.service }}."
      - alert: ServiceFlapping
        expr: changes(healthwatch_service_up[15m]) > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service flapping"
          description: "Healthwatch detected frequent restarts for {{ $labels.service }}."
