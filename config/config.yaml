app:
  name: autotrader
  env: prod
  timezone: Europe/Rome
  log_level: INFO

market:
  venue: Multi
  default_currency: EUR
  open_mode: any
  venues:
    - name: BorsaItaliana
      timezone: Europe/Rome
      trading_hours:
        open: "09:00"
        close: "17:30"
      holidays: []
    - name: NYSE
      timezone: America/New_York
      trading_hours:
        open: "09:30"
        close: "16:00"
      holidays: []
    - name: Nasdaq
      timezone: America/New_York
      trading_hours:
        open: "09:30"
        close: "16:00"
      holidays: []

brokers:
  alpaca:
    enabled: true
    base_url: "https://paper-api.alpaca.markets"
    api_key: "${ALPACA_API_KEY}"
    api_secret: "${ALPACA_API_SECRET}"
  ibkr:
    enabled: false
    host: "127.0.0.1"
    port: 7497
    client_id: 1

risk:
  max_daily_loss_pct: 2.0
  max_position_size_pct: 5.0
  max_portfolio_leverage: 1.5
  max_short_exposure_pct: 30.0
  max_positions: 20
  cooldown_seconds: 120
  hard_stop_pct: 4.0
  trailing_stop_pct: 2.0
  circuit_breaker_drawdown_pct: 5.0

strategy:
  name: "intraday_momentum"
  params:
    lookback_minutes: 30
    entry_threshold_pct: 0.8
    exit_threshold_pct: 0.4
    position_horizon_minutes: 90
    allow_shorts: true

learning:
  enabled: true
  model_path: "/app/models/ppo_policy.zip"
  device: "auto"
  window_size: 50
  features:
    include_returns: true
    sma_periods: [5, 20]
    ema_periods: [10]
    rsi_periods: [14]
  guardrail:
    enabled: true
    mode: "confirm"
    params:
      lookback_minutes: 30
      entry_threshold_pct: 0.8
      exit_threshold_pct: 0.4
      allow_shorts: true
  online:
    enabled: true
    update_interval_minutes: 60
    timesteps: 1000
    eval_split: 0.1
  training:
    data_dir: "/data"
    interval: "1m"
    timesteps: 200000
    initial_cash: 100000
    commission_pct: 0.05
    slippage_bps: 2
    eval_split: 0.2
    resume: true
    report_path: "/app/models/training_report.json"
    report_plot_dir: "/app/models/reports"

backtest:
  data_dir: "/data"
  start: "2025-12-11"
  end: "2025-12-19"
  initial_cash: 100000
  commission_pct: 0.05
  slippage_bps: 2
  use_gpu: true

data:
  provider: yfinance
  symbols:
    - "AAPL"
    - "MSFT"
  interval: "1m"
  lookback_days: 7
  start: ""
  end: ""
  proxy: ""
  rate_limit_seconds: 2
  output_dir: "/data"
  sources:
    - provider: yfinance
      enabled: true
      symbols:
        - "AAPL"
        - "MSFT"
      interval: "1m"
      lookback_days: 7
      rate_limit_seconds: 2
    - provider: stooq
      enabled: false
      symbols:
        - "eni"
        - "pkn"
      interval: "1d"
      rate_limit_seconds: 2
    - provider: alphavantage
      enabled: false
      api_key: "${ALPHAVANTAGE_API_KEY}"
      symbols:
        - "AAPL"
        - "MSFT"
      interval: "1d"
      rate_limit_seconds: 15

monitoring:
  prometheus_port: 8001
  metrics_path: "/metrics"
