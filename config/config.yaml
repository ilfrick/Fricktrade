app:
  name: autotrader
  env: prod
  timezone: Europe/Rome
  log_level: INFO
api:
  auth:
    enabled: false
    token_env: FRICKTRADE_API_TOKEN
logging:
  file_path: /data/logs/trader.log
  max_bytes: 5000000
  backup_count: 5
market:
  venue: Multi
  default_currency: EUR
  default_symbol_venue: NYSE
  symbol_venues: {}
  symbol_currencies: {}
  symbol_sectors: {}
  symbol_venues_auto:
    enabled: true
    refresh_minutes: 1440
    max_symbols: 50000
    exchange_venue_map:
      NYSE: NYSE
      NASDAQ: Nasdaq
      ARCA: NYSE
      AMEX: NYSE
  open_mode: any
  trading_venues:
    - NYSE
    - Nasdaq
    - Crypto
  extended_hours:
    enabled: false
  holiday_update:
    enabled: true
    interval_days: 7
    years_ahead: 1
  venues:
  - name: Crypto
    timezone: UTC
    trading_hours:
      open: "00:00"
      close: "23:59"
    holidays: []
  - name: BorsaItaliana
    timezone: Europe/Rome
    trading_hours:
      open: 09:00
      close: '17:30'
    holidays:
    - '2026-01-01'
    - '2026-01-06'
    - '2026-04-03'
    - '2026-04-05'
    - '2026-04-06'
    - '2026-04-25'
    - '2026-05-01'
    - '2026-05-25'
    - '2026-06-02'
    - '2026-08-15'
    - '2026-10-04'
    - '2026-11-01'
    - '2026-12-08'
    - '2026-12-25'
    - '2026-12-26'
    - '2027-01-01'
    - '2027-01-06'
    - '2027-03-26'
    - '2027-03-28'
    - '2027-03-29'
    - '2027-04-25'
    - '2027-05-01'
    - '2027-05-17'
    - '2027-06-02'
    - '2027-08-15'
    - '2027-10-04'
    - '2027-11-01'
    - '2027-12-08'
    - '2027-12-25'
    - '2027-12-26'
  - name: NYSE
    timezone: America/New_York
    trading_hours:
      open: 09:30
      close: '16:00'
      extended_open: 04:00
      extended_close: '20:00'
    holidays:
    - '2026-01-01'
    - '2026-01-19'
    - '2026-02-16'
    - '2026-04-03'
    - '2026-05-25'
    - '2026-06-19'
    - '2026-09-07'
    - '2027-01-01'
    - '2027-01-18'
    - '2027-02-15'
    - '2027-03-26'
    - '2027-05-31'
    - '2027-09-06'
  - name: Nasdaq
    timezone: America/New_York
    trading_hours:
      open: 09:30
      close: '16:00'
      extended_open: 04:00
      extended_close: '20:00'
    holidays:
    - '2026-01-01'
    - '2026-01-19'
    - '2026-02-16'
    - '2026-04-03'
    - '2026-05-25'
    - '2026-06-19'
    - '2026-07-03'
    - '2026-09-07'
    - '2026-11-26'
    - '2026-12-25'
  asset_classes:
    equities:
      venues: [NYSE, Nasdaq]
      min_price: 2.0
      order_types: [market, limit, stop, stop_limit]
      time_in_force: [day, gtc, ioc]
      shortable: true
      marginable: true
    crypto:
      venues: [Crypto]
      min_price: 0.0
      order_types: [market, limit, stop_limit]
      time_in_force: [gtc, ioc]
      shortable: false
      marginable: false
brokers:
  alpaca:
    enabled: true
    base_url: https://paper-api.alpaca.markets
    api_key: ${ALPACA_API_KEY}
    api_secret: ${ALPACA_API_SECRET}
    accounts:
    - name: Realistic
      asset_filter: crypto_only  # both | crypto_only | equity_only
      risk:
        hard_stop_pct: 1.0
      reward:
        time_penalty_weight: 0.8
        time_normalizer: 240.0
    - name: Higher
      asset_filter: crypto_only  # both | crypto_only | equity_only
    fees:
      commission_pct: 0.0
      per_trade_fee: 0.0
      per_share_fee: 0.0
      min_fee: 0.0
      spread_pct: 0.0
  binance:
    enabled: true
    futures: false                                  # Spot mode; set true for Futures (FAPI) endpoints
    base_url: ${BINANCE_BASE_URL}                   # spot demo: https://demo-api.binance.com; fapi demo: https://demo-fapi.binance.com; blank = live
    testnet: false
    api_key: ${BINANCE_API_KEY}
    api_secret: ${BINANCE_API_SECRET}
    accounts: []             # optional: named sub-accounts (same structure as alpaca.accounts)
    risk:
      max_crypto_exposure_pct: 95.0  # crypto-only broker — global 50% cap doesn't apply here
      exposure_caps:
        venues:
          Crypto: 95.0  # override global 50% venue cap — Binance is crypto-only
    fees:
      commission_pct: 0.05  # 0.05% standard futures taker; 0.02% maker
      per_trade_fee: 0.0
      per_share_fee: 0.0
      min_fee: 0.0
      spread_pct: 0.0
  ibkr:
    enabled: false
    host: 127.0.0.1
    port: 7497
    client_id: 1
    account_id: ''
    currency: ${IBKR_CURRENCY}
    accounts: []
    fees:
      commission_pct: 0.0
      per_trade_fee: 0.0
      per_share_fee: 0.0
      min_fee: 0.0
      spread_pct: 0.0
risk:
  enabled: true
  max_daily_loss_pct: 3.0
  crypto:
    max_daily_loss_pct: 5.0
    max_position_size_pct: 90.0
    max_crypto_exposure_pct: 50.0
    hard_stop_pct: 4.0
    trailing_stop_pct: 3.0
    take_profit_pct: 4.0
    circuit_breaker_drawdown_pct: 8.0
    vol_targeting:
      target_vol_pct: 4.0
  max_position_size_pct: 90.0
  max_portfolio_leverage: 3.0
  max_short_exposure_pct: 30.0
  max_positions: 15
  cooldown_seconds: 5
  hard_stop_pct: 0.8
  trailing_stop_pct: 5.0
  circuit_breaker_drawdown_pct: 5.0
  take_profit_pct: 1.5
  partial_take_profit_pct: 1.0
  partial_take_profit_ratio: 0.5
  vol_targeting:
    enabled: false
    target_vol_pct: 2.0
    min_scale: 0.5
    max_scale: 1.5
  stress:
    enabled: false
    shock_pct: 5.0
  liquidity_haircut:
    enabled: false
    max_participation: 0.1
    min_session_volume: 100000
    max_spread_pct: 1.0
    volume_haircut_pct: 50.0
  var:
    enabled: false
    window: 60
    confidence: 0.95
    max_var_pct: 4.0
    max_cvar_pct: 6.0
  exposure_caps:
    enabled: false
    venues:
      NYSE: 60.0      # max 60% in NYSE-listed equities
      Nasdaq: 60.0    # max 60% in Nasdaq-listed equities
      Crypto: 50.0    # max 50% in crypto (also enforced by risk.crypto)
    sectors:
      Technology: 35.0
      Healthcare: 25.0
      Financials: 25.0
      Energy: 20.0
      Consumer Discretionary: 20.0
  pdt:
    force_swing: true        # hold overnight instead of triggering PDT violation
    equity_threshold: 2500   # accounts below this are PDT-restricted (Alpaca threshold)
    daytrade_count_limit: 3  # block exit when rolling 5-day day-trade count >= this
  kill_switch_profiles:
    enabled: false
    mode: static
    current: medium
    adaptive:
      low_vol_max_pct: 1.0
      high_vol_min_pct: 3.0
    profiles:
      low:
        max_daily_loss_pct: 1.0
        circuit_breaker_drawdown_pct: 4.0
      medium:
        max_daily_loss_pct: 2.0
        circuit_breaker_drawdown_pct: 6.0
      high:
        max_daily_loss_pct: 3.0
        circuit_breaker_drawdown_pct: 8.0
trading_limits:
  enabled: true
  allow_shorts: false
  enforce_account_flags: true
  blocked_symbols: []
  blocked_actions: []
  min_price: 2.0
  fractional_shares: true   # enable fractional qty for crypto (always) and equities
  min_notional: 10.0         # minimum USD order value; Alpaca crypto minimum is $10
  crypto_order_margin: 0.97  # safety haircut on crypto buy notional to absorb price drift between sizing and market-order fill
strategy:
  name: crypto_momentum
  names:
  - crypto_momentum
  - crypto_mean_reversion
  - trend_following
  combine: vote
  # min_conviction / single_sided_conviction_multiplier / fee_aware are weighted-mode only;
  # unused in vote mode (votes are unweighted action counts).
  signal_bias_guard:
    enabled: false
    threshold: 0.65
  performance:
    enabled: true
    window_days: 30
    min_trades: 20
    min_win_rate: 0.4
    max_drawdown_pct: 12.0
    report_interval_minutes: 10
    report_path: /data/reports/strategy_performance.json
    kill_switch:
      enabled: false
  params:
    lookback_minutes: 10
    entry_threshold_pct: 0.5
    exit_threshold_pct: 0.15
    position_horizon_minutes: 0    # disabled — hard/trailing stops and TP handle exits
    min_hold_minutes: 15        # suppress all stop/take-profit exits for 15 min after entry
    exit_vote_threshold: 2     # vote mode: exit a held position when ≥N strategies say sell/exit
    buy_vote_threshold: 2      # vote mode: open a new position when ≥N strategies say buy (0=strict majority)
    buy_vote_threshold_trending: 2  # in low_vol_trending regime, require 2 strategies to agree (was 1 — fired on noise)
    crypto_eligible_strategies:
      - crypto_momentum
      - crypto_mean_reversion
      - trend_following
    alt_data_fear_greed_block: 20   # suppress crypto longs when F&G below this
    alt_data_oi_block: -5.0         # suppress crypto longs when OI change % below this
    alpha_decay_exit:
      enabled: true            # exit when the entry strategy actively signals sell
      min_hold_minutes: 30      # don't check alpha decay before this time
    regime_hold_minutes:
      enabled: true            # replace fixed position_horizon_minutes with Hurst-scaled hold
      base_minutes: 120         # baseline; replaces position_horizon_minutes when enabled
      trending_multiplier: 2.0  # H > hurst_trending_threshold → hold up to 240 min
      mean_reverting_multiplier: 0.75  # H < hurst_mr_threshold → hold 90 min (was 60 — too short for crypto bounces)
      hurst_trending_threshold: 0.60
      hurst_mr_threshold: 0.45
    opportunity_cost_exit:
      enabled: false            # eject flat stale positions when at exposure cap
      min_hold_minutes: 60      # don't eject positions younger than this
      flat_atr_multiplier: 0.5  # "flat" = |pnl_pct| < 0.5 × atr_pct
      exposure_threshold_pct: 80  # only trigger when portfolio ≥ 80% of max exposure
    allow_shorts: true
    trend_following:
      fast_window: 10
      slow_window: 30
      breakout_pct: 1.0
      exit_pct: 0.5
      # enabled: false   # uncomment to disable this strategy without restart
      min_conviction_by_regime:
        low_vol_trending: 0.25   # lower bar — strong trending conditions
        high_vol_crisis: 0.50    # higher bar — trend signals unreliable in crisis
    factor_model:
      momentum_weight: 0.5
      liquidity_weight: 0.2
      volatility_weight: 0.1
      mr_weight: 0.15
      buy_threshold: 0.2
      sell_threshold: -0.2
    stat_arb_pairs:
      enabled: false  # disabled: long-only mode produces unhedged directional bets; re-enable with allow_shorts: true
      lookback: 50
      z_entry: 1.5
      z_exit: 0.5
      refresh_minutes: 30
      max_pairs: 25
      min_conviction_by_regime:
        high_vol_crisis: 0.20    # stat_arb thrives in crisis — lower bar
    market_maker:
      base_spread_pct: 0.4
      inventory_target_pct: 0.0
      skew_pct: 0.15
      min_qty: 1
    crypto_momentum:
      fast_window: 5
      medium_window: 15
      slow_window: 60
      volume_mult: 1.5    # used as confidence boost multiplier, not a hard gate
      min_return_pct: 0.15  # relaxed from 0.3 — 0.3% is too strict for 5m bars at off-peak hours
      trailing_stop_pct: 2.0
    crypto_mean_reversion:
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30.0  # 35 catches normal pullbacks; 30 targets genuine oversold conditions
      drop_window_bars: 15
      hard_stop_pct: 3.0
    gap_reversal:
      min_gap_pct: 2.0
      target_fill_pct: 50.0
      stop_pct: 0.5
      volume_confirm_mult: 2.0
      max_trade_window_minutes: 60
      rsi_period: 5
      rsi_oversold: 30.0
      rsi_overbought: 70.0
    earnings_drift:
      min_gap_pct: 5.0
      min_volume_mult: 1.5
      hold_days: 20
      trailing_stop_pct: 4.0
    top_movers_rf:
      data_dir: /data
      model_path: /data/models/top_movers_rf/top_movers_rf.pkl
      auto_train_on_start: true
      retrain_if_older_hours: 24
      min_training_days: 5
      min_bars: 60
      top_n: 10
      runtime_interval: 5m
      training_interval: 5m
      cutoff_minutes: 30
      entry_warmup_minutes: 20
      entry_horizon_minutes: 90
      low_zone_tol_pct: 0.35
      rebound_target_pct: 2.0
      buy_nowcast_min: 0.50
      buy_entry_min: 0.50
      buy_score_min: 0.54
      exit_score_max: 0.40
      exit_pullback_from_high_pct: 1.2
      nowcast_weight: 0.65
      entry_weight: 0.35
      respect_account_blocks: true
      respect_pdt_soft_block: true
      pdt_daytrade_limit: 3
      pdt_min_equity: 25000
      min_buying_power: 50
orchestrator:
  mode: select
  top_k: 99
  min_score: 0.0
  # strategy_weights and rl sections removed — strategy_weights are ignored in vote mode,
  # and the LSTM RL orchestrator is disabled. Both were dead config.
learning:
  enabled: true
  model_path: /app/models/ppo_policy.zip
  best_model_path: /app/models/ppo_policy_best.zip
  use_best_model: false
  device: auto
  window_size: 50
  reward:
    nav_weight: 1.0
    time_penalty_weight: 1.5
    profit_bonus_weight: 3.0
    velocity_weight: 0.3
    nav_normalizer: 100000.0
    time_normalizer: 120.0
    velocity_window: 20
    bar_interval_minutes: 5.0
  live_rewards:
    enabled: true
    path: /data/learning/live_rewards.jsonl
    positions_path: /data/learning/live_positions.json
    max_days: 7
    mode: add
    reward_pnl_mode: pct
    reward_pnl_scale: 1.0
  features:
    include_returns: true
    include_signal_features: true
    include_extended_indicators: true
    include_regime_features: true
    include_mtf_features: true
    signal_interval: 5m
    sma_periods:
    - 5
    - 20
    ema_periods:
    - 10
    rsi_periods:
    - 14
    adx_periods:
    - 14
    trend_strength_periods:
    - 14
  registry:
    enabled: true
    path: /app/models/model_registry.json
    artifact_dir: /app/models/registry
    artifact_prefix: ppo_policy
    active_path: /app/models/model_active.json
    use_active: true
    publish_mode: latest
    refresh_minutes: 5
  drift:
    enabled: false
    window: 120
    feature_zscore_threshold: 3.0
    max_drift_feature_pct: 0.3
    pnl_window: 30
    max_pnl_drop_pct: 2.0
    auto_rollback: true
    baseline_enabled: true
    baseline_max_samples: 5000
    baseline_stride: 5
  guardrail:
    enabled: false
    mode: confirm
    params:
      lookback_minutes: 30
      entry_threshold_pct: 0.8
      exit_threshold_pct: 0.2
    allow_shorts: false
  online:
    enabled: true
    update_interval_minutes: 60
    timesteps: 1000
    eval_split: 0.1
    respect_ops_state: true
    use_live_rewards: true
  training:
    data_dir: /data/rl_train_small
    interval: 5m
    timesteps: 50000
    checkpoint_best_only: false
    use_live_rewards: false
    initial_cash: 200
    commission_pct: 0.05
    slippage_bps: 2
    eval_split: 0.2
    resume: false
    random_start_pos_prob: 0.3  # 30% of training episodes start with an inherited position; teaches model to hold, not panic-sell on reload
    sell_happy_threshold: 0.6   # block model from going live if it immediately sells on >60% of inherited-position probes
    report_path: /app/models/training_report.json
    best_report_path: /app/models/training_report_best.json
    report_plot_dir: /app/models/reports
  # TCN (Temporal Convolutional Network) feature extractor config
  tcn:
    enabled: true
    features_dim: 64
    num_layers: 3
    kernel_size: 3
    dropout: 0.1
    net_arch:
      pi: [64, 64]
      vf: [64, 64]
  # Regime detection (HMM-based)
  regime:
    enabled: true
    n_regimes: 3
    lookback: 100
    vol_window: 20
    skew_window: 20
# Portfolio optimization
portfolio:
  enabled: true
  method: risk_parity
  risk_model:
    method: ledoit_wolf
    window: 60
  constraints:
    max_position_pct: 0.90
    min_position_pct: 0.01
    max_sector_pct: 0.40
  rebalance:
    enabled: true
    drift_threshold_pct: 5.0
    min_trade_pct: 0.5
    min_interval_minutes: 60
backtest:
  data_dir: /data
  start: '2025-11-20'
  end: '2026-02-13'
  initial_cash: 100000
  symbols:
    - AAPL
    - MSFT
    - NVDA
    - GOOGL
    - AMZN
    - META
    - TSLA
    - JPM
    - V
    - UNH
    - HD
    - PG
    - JNJ
    - BAC
    - XOM
    - COST
    - AMD
    - CRM
    - NFLX
    - INTC
  commission_pct: 0.05
  slippage_bps: 2
  spread_bps: 0
  use_gpu: true
  mode: agent
  symbols_source: config
  cache:
    enabled: true
    format: npz
    dir: /data/backtest_cache
    compress: false
  dynamic_symbols_enabled: true
  news_enabled: false
  news_source: none
  news_path: /data/news_cache.json
  run_when_closed: true
  plan:
    enabled: false
    window_days: 60
    step_days: 30
    liquidity_tiers: 3
    sample_per_tier: 50
    seed: 42
test_report:
  enabled: true                                          # generate Word report each market-closed cycle
  output_path: /data/reports/test_report_{date}.docx    # {date} replaced with YYYY-MM-DD
  tests_dir: tests

benchmarking:
  run_when_closed: false
  use_plan: true
  plan_window_days: 60
  plan_step_days: 30
  plan_liquidity_tiers: 3
  plan_sample_per_tier: 10
  bootstrap_samples: 500
  bootstrap_confidence: 0.95
  seed: 42
  mc:
    enabled: true
    runs: 10
    slippage_bps_range:
    - 2
    - 10
    spread_bps_range:
    - 0
    - 8
    commission_pct_range:
    - 0.02
    - 0.2
  output_path: /data/reports/benchmark_report.json
  plot_dir: /data/reports/benchmark_plots
  pdf_path: /data/reports/benchmark_report.pdf
data:
  provider: alpaca
  prefetch_enabled: true
  prefetch_after_filter: false
  process_on_new_bar_only: false
  symbols: []
  interval: 5m
  lookback_days: 7
  session_gain_mode: gap
  quality:
    enabled: true
    report_path: /data/reports/data_quality.json
    gap_multiplier: 3
    outlier_zscore: 6
  adjustments:
    enabled: false
    dir: /data/adjustments
  dynamic_symbols:
    enabled: true
    provider: alpaca
    feed: iex
    refresh_minutes: 1
    max_symbols: 500       # active set after pre-scan + AI filter; pre-scan reduces ~10k→500 before scoring
    max_universe: 15000    # full equity universe loaded from Alpaca; pre-scan then narrows this down
    universe: alpaca_active_all  # equities + crypto; derived live from Alpaca account assets
    crypto_quote_currencies: [USD]  # only trade crypto pairs quoted in USD; add USDC/USDT if you hold stablecoin balances
    universe_price_filter: true
    cash_aware: true
    cash_buffer_pct: 95
    cash_cap_mode: cash
    cash_max_pct: 100
    timeout_seconds: 30    # 30s avoids retry on 33-symbol crypto bulk-fetch (was 10s, causing ~29s latency on retry)
    retries: 2
    ai_filter:
      enabled: true
      provider: yfinance
      coverage_filter: true
      use_cached_symbols: false
      interval: 5m
      lookback_days: 2
      window: 20
      retrain_hours: 6
      max_inflight_seconds: 600
      # Pre-scan: run a fast Alpaca snapshot pass to trim the full equity universe
      # (~10k → ~500) before handing off to the AI filter. Crypto symbols always
      # bypass the pre-scan and pass through directly.
      pre_scan:
        enabled: true
        max_symbols: 1000          # keep top movers; AI filter further trims to max_symbols
        price_min: 2.0             # skip penny stocks
        relative_volume_min: 0.3   # relaxed — pre-scan is a coarse gate, AI filter is precise
        min_shares_traded: 50000   # exclude truly illiquid tickers
      model_type: ppo
      model_path: /data/ai_symbol_filter.zip
      train_max_symbols: 100
      max_samples_per_symbol: 200
      rl:
        timesteps: 2000
        learning_rate: 0.0003
        batch_size: 64
        n_steps: 64
        gamma: 0.99
        ent_coef: 0.01
        clip_range: 0.2
        gae_lambda: 0.95
      online:
        enabled: true
        learning_rate: 0.001
        steps: 10
        timesteps: 256
        max_symbols: 500
      news:
        enabled: true
        provider: alpaca
        base_url: https://data.alpaca.markets
        lookback_hours: 12
        keywords: []
        timeout_seconds: 10
        retries: 2
      timeout_seconds: 15
      retries: 2
      feed: iex
      objective: return_time_penalty
      time_penalty_per_bar: 0.15
      allow_orchestrator_fetch: false
      keras_returns:
        enabled: true
        model_path: /app/models/keras/stocks_price_regression_128_60-60m_5minc_best.keras
        interval: 5m
        score_mode: expected_return
        weight: 0.5
      # Return ranker: sklearn GBM trained on collected 5m bar data.
      # Set enabled: true after 5+ sessions of training data are collected.
      # When enabled, replaces keras_returns as the per-symbol overlay scorer.
      return_ranker:
        enabled: true
        model_path: /data/return_ranker.pkl
        data_dir: /data/training
        retrain_hours: 24
        max_age_days: 3
    filters:
      price_min: 2.0
      relative_volume_min: 2.0
      premarket_gain_min_pct: 1.0
      min_shares_traded: 500000
      max_spread_pct: 0.3
      strict_spread: true
      require_catalyst: false
    fallback:
      enabled: true
      relative_volume_min: 0.0
      premarket_gain_min_pct: 0.0
      min_shares_traded: 100000
      max_spread_pct: 2.0
      require_catalyst: false
  start: ''
  end: ''
  proxy: ''
  rate_limit_seconds: 2
  output_dir: /data
  sources:
  - provider: yfinance
    enabled: true
    symbols: []
    interval: 5m
    lookback_days: 7
    rate_limit_seconds: 2
    symbol_blacklist: []
  - provider: alpaca
    enabled: true
    symbols: []
    universe: alpaca_active
    max_universe: 10000
    interval: 5m
    start: '2025-10-23'
    end: '2025-12-22'
    rate_limit_seconds: 1
  - provider: stooq
    enabled: false
    symbols:
    - eni
    - pkn
    interval: 5m
    rate_limit_seconds: 2
  - provider: alphavantage
    enabled: false
    api_key: ${ALPHAVANTAGE_API_KEY}
    symbols: []
market_cache:
  enabled: true
  redis_url: redis://redis:6379/0
  file_dir: /data/market_cache
  batch_size: 50
  delay_seconds: 3.0
  max_age_multiplier: 3  # 5m * 3 = 15 min TTL (Alpaca data is more timely)
  cache_only: false
  ignore_staleness: false
  allow_pickle: false
  filtered_symbols:
    enabled: true
checkpointing:
  enabled: true
  interval_seconds: 60
  dir: /data/checkpoints
  keep_history: true
  retention:
    max_age_hours: 72
    max_files: 200
healthwatch:
  enabled: true
  interval_seconds: 30
  timeout_seconds: 30
  port: 9105
  targets:
    trader: http://trader:8001/metrics
    api: http://api:8000/health
    prometheus: http://prometheus:9090/-/healthy
    grafana: http://grafana:3000/api/health
    alertmanager: http://alertmanager:9093/-/healthy
  market_shutdown:
    enabled: true
    mode: partial  # 'full' stops trader; 'partial' keeps it running for crypto 24/7
    project_name: fricktrade
    check_interval_seconds: 60
    start_before_minutes: 15
    heartbeat_minutes: 15
    write_state: true
    state_path: /data/system_state.json
    keep_services:
    - healthwatch
    - autoheal
    - docker-socket-proxy
    - daily-report
    - prometheus
    - tests-when-closed
    - trader          # Always on — crypto trades 24/7
    - api             # Always on — monitoring
    - market-cache    # Always on — crypto data
    - redis           # Always on — cache backend
    - learner         # Always on — crypto data trains 24/7
    - grafana         # Always on — 24/7 monitoring
    - alertmanager    # Always on — 24/7 alerts
    stop_services:
    - ollama          # Shut down outside equity hours (saves GPU)
kill_switch:
  armed: false
  confirm_code: ''
  required_code: ${KILL_SWITCH_CODE}
  confirm_phrase: 'YES'
  force_sleep: false
  force_liquidate: false
reports:
  daily_top_movers:
    enabled: true
    top_n: 10
    universe: alpaca_active
    max_universe: 5000
    feed: iex
    output_dir: /data/reports/daily_top_movers
    training_enabled: true
    training_data_dir: /data
    check_interval_seconds: 60
    close_delay_minutes: 5
    broker_venues: {}
    use_symbol_venues_auto: true
    prometheus_url: http://prometheus:9090
    signal_thresholds:
      early_return_30m_pct: 1.5
      sustained_return_60m_pct: 2.5
      early_volume_pct: 20.0
      runup_pct: 4.0
      drawdown_pct: -2.0
    news:
      enabled: true
      provider: alpaca
      max_headlines: 8
      include_summaries: false
      correlation_window_minutes: 90
    decision_trace:
      enabled: true
      output_dir: /data/reports/decision_trace
    explain_ai:
      enabled: true
      provider: ollama
      base_url: http://ollama:11434
      model: llama3.2:3b  # Smaller model to avoid GPU OOM
      timeout_seconds: 60
      max_text_chars: 800
    email:
      use_alertmanager_config: true
      alertmanager_config_path: /app/alertmanager/alertmanager.yml
      smtp_require_tls: true
news:
  enabled: true
  provider: alpaca
  base_url: https://data.alpaca.markets
  api_key: ${ALPACA_API_KEY}
  api_secret: ${ALPACA_API_SECRET}
  lookback_hours: 12
  cache_minutes: 10
  keywords: []
  timeout_seconds: 10
  retries: 2
  llm:
    enabled: true
    provider: ollama
    base_url: http://ollama:11434
    model: llama3.2:3b  # Smaller model to avoid GPU OOM
    timeout_seconds: 120  # CPU mode is slow, needs longer timeout
    max_items: 25
    max_text_chars: 800
  sources:
    # Additional freely available news sources beyond the primary Alpaca provider.
    # Articles are fetched once per news cache TTL, merged with Alpaca results,
    # then parsed by Ollama (catalyst) and Gemini (sentiment) each cycle.
    - name: coindesk
      enabled: true         # Crypto — broad coverage, low noise
    - name: cointelegraph
      enabled: true         # Crypto — high volume
    - name: bitcoin_magazine
      enabled: true         # BTC-focused
    - name: the_block
      enabled: true         # Institutional crypto news
    - name: reuters_business
      enabled: true         # Equities + macro
    - name: globe_newswire
      enabled: false        # Press releases — high volume, equity-focused
    - name: pr_newswire
      enabled: false        # Press releases — noisy
    - name: cryptopanic
      enabled: false        # Aggregator; free tier, no key required
      api_key: ""
    - name: yahoo_finance_rss
      enabled: false        # Per-symbol RSS; adds latency (one request/symbol)
    - name: google_news_rss
      enabled: false        # Per-symbol Google News; rate-limit sensitive
pattern_trading:
  selection:
    price_min: 2.0
    relative_volume_min: 1.0
    premarket_gain_min_pct: 1.0
    min_shares_traded: 100000
    max_spread_pct: 1.0
    strict_spread: false
    require_catalyst: false
  pattern:
    ma_periods:
    - 9
    - 20
    pullback_max_retrace_pct: 50
  entry:
    breakout_lookback_bars: 20
    volume_confirm_mult: 1.5
  risk:
    stop_loss_pct: 0.05
    partial_take_profit_pct: 0.1
    trailing_stop_pct: 0.02
execution:
  symbol_executor_workers: 4
  stuck_cooldown_minutes: 15
  insufficient_stablecoin_cooldown_minutes: 5  # cooldown after insufficient_stablecoin rejection to stop per-cycle retry loop
  stop_exit_reentry_cooldown_minutes: 30  # cooldown after trailing_stop/hard_stop/atr_stop exit to prevent immediate re-buy churn
  stuck_blacklist_after: 3      # consecutive timed-out buys before blacklist (raised from 2; demo API unreliable)
  stuck_blacklist_hours: 2      # hours to blacklist a symbol after repeated stuck orders
  limit_orders:
    enabled: true             # Use limit orders by default; market orders only for high urgency
    default_offset_bps: 3.0   # Fallback offset when spread_pct unavailable (3 bps)
    high_urgency_threshold: 0.8  # calibrated_confidence > this → market order
  open_orders:
    enabled: true
    interval_seconds: 30
    skip_if_pending: true
    missing_grace_seconds: 5   # Alpaca/Binance market fills in <1s; 30 was doubling detection lag
  algos:
    enabled: true
    default: twap
    min_notional: 500.0
    adaptive:
      enabled: true
      impact_bps_thresholds:
        vwap: 4
        pov: 8
    twap:
      duration_seconds: 120
      slices: 4
    vwap:
      duration_seconds: 120
      profile:
      - 1
      - 1
      - 1
      - 1
    pov:
      max_participation: 0.1
      estimated_volume: 100000
  impact:
    base_bps: 1.0
    volume_scale_bps: 50.0
    min_vol_pct: 0.5
  retry:
    enabled: true
    max_attempts: 2
    backoff_seconds: 10
    max_notional: 5000
    max_order_age_seconds: 300   # Cancel + unblock queue if order stuck > 5 min
    reasons:
    - unknown
    - insufficient_funds
  brokers:
    enabled: true
    routing:
      mode: parallel
      buying_power_scaling: false  # fractional: _size_order already scales by equity; both accounts evaluate full universe
      default: alpaca
      symbols: {}
      strategies: {}
      fallback_enabled: false
llm:
  enabled: true  # Master switch — requires ANTHROPIC_API_KEY and GOOGLE_GEMINI_API_KEY in .env

  # Backend assignment per module
  backends:
    sentiment: ollama        # Free local inference (llama3.1:8b)
    symbols_filter: gemini   # High volume, large context
    post_session: gemini     # Large trade logs
    meta_orchestrator: gemini # Complex reasoning
    risk_interpreter: gemini  # Safety-critical

  # Macro regime analyzer (Claude) — fetches FRED data + calls LLM every 4h
  macro_regime:
    enabled: true
    refresh_hours: 4
    backend: gemini

  # Sentiment analyzer — per-symbol news analysis
  # Disabled: vote mode skips _enrich_signals entirely so scores never reach decisions.
  # Re-enable with backend: gemini when switching to weighted/confidence combine mode.
  # Local Ollama (llama3.1:8b, 4.4GB VRAM) generates at ~0.5 tok/s — full JSON
  # response needs 200-500 tokens = 400-1000s per call, well beyond the 45s timeout.
  sentiment:
    enabled: false
    cache_ttl_seconds: 900
    max_news_items: 10
    min_confidence_to_inject: 0.3

  # Aggregate market sentiment via local Ollama (llama3.2:3b, ~1.5s/call).
  # Runs every 15 min in background; result passed to tactical + strategic orchestrators.
  # Never blocks main loop — runs in news executor thread with a hard timeout.
  ollama_sentiment:
    enabled: true
    base_url: http://ollama:11434
    model: llama3.2:3b         # 3B model: ~1.5s/call; fast enough for 15-min cadence
    timeout_seconds: 30        # hard wall-clock limit — ollama call aborted if exceeded
    max_headlines: 20          # max headlines per analysis call

  # Daily symbol selection (Gemini) — replaces PPO filter
  symbols_filter:
    enabled: false           # Enable manually; runs pre-market, overrides AI filter
    run_time: pre_market   # pre_market | manual
    select_count: 30
    fallback_to_rules: true  # Use rule-based filter if LLM fails
    crypto_refresh_hours: 4  # Re-run filter for crypto symbols every N hours (24/7)

  # Post-session analyst (Gemini) — automated daily review
  post_session:
    enabled: true
    auto_run: true           # Run automatically at session end
    output_dir: /data/reports/session
    max_trades_in_context: 100
    auto_apply_weights: false  # If true, apply weight changes without confirmation

  # Meta-orchestrator (Claude) — weekly weight rebalancing
  meta_orchestrator:
    enabled: false
    run_day: sunday          # Day of week for weekly review
    auto_apply: false        # Require human confirmation
    max_weight_change: 0.15  # Max change per strategy per week
    min_sessions_required: 3 # Minimum sessions before adjusting

  # Risk event interpreter (Claude) — replaces simple auto-rollback
  risk_interpreter:
    enabled: true
    min_severity: medium     # Interpret medium/high/critical alerts
    timeout_seconds: 15      # Max wait for LLM response

  # Cost management
  cost:
    daily_budget_usd: 5.00
    alert_threshold_usd: 4.00
    log_all_costs: true

monitoring:
  prometheus_port: 8001
  metrics_path: /metrics
  audit:
    enabled: false
    output_dir: /data/reports/audit
    include_features: true
    include_market_state: false
    retention_days: 30
    enforce_reason_codes: false
    reason_codes_path: /app/config/reason_codes.json
    signing:
      enabled: false
      secret_env: AUDIT_SIGNING_SECRET
  compliance:
    enabled: false
    output_dir: /data/reports/compliance
    formats:
    - jsonl
    - csv
    include_features: false
    include_market_state: false
    retention_days: 30
    enforce_reason_codes: false
    reason_codes_path: /app/config/reason_codes.json
    signing:
      enabled: false
      secret_env: COMPLIANCE_SIGNING_SECRET
alt_data:
  fear_greed:
    enabled: true
  coinglass:
    enabled: true
    api_key: ${COINGLASS_API_KEY}
    base_url: https://open-api.coinglass.com/public/v2
  sec_edgar:
    enabled: true
    base_url: https://data.sec.gov
  alpha_vantage:
    enabled: true
    api_key: ${ALPHA_VANTAGE_API_KEY}
    base_url: https://www.alphavantage.co/query
fred:
  api_key: ${FRED_API_KEY}
  base_url: https://api.stlouisfed.org/fred
quote_stream:
  enabled: false   # disabled: websockets version incompatible with alpaca-py (extra_headers kwarg)
  feed: iex
  crypto: true

llm_orchestrator:
  enabled: true
  mode: vote                # vote: no LLM, pure signal vote; portfolio: one Gemini call/cycle
  provider: gemini
  model: gemini-2.5-flash  # flash: reliable JSON output, <1s latency, 33x cheaper than pro
  max_tokens: 8192          # per-broker decisions: 3 brokers × 33 symbols ~100 entries in JSON
  min_signal_score: 0.03   # skip LLM if no symbol has confidence > 3%
  pnl_history_size: 100    # completed trades kept in rolling window for strategy win-rate stats
  price_invalidation_pct: 0.01  # invalidate cached decision if price moves ≥ 1% since last LLM call
  exit_drawdown_pct_crypto: 1.5   # LLM may exit against hold vote when crypto position is down ≥ 1.5%
  exit_drawdown_pct_equity: 0.5   # LLM may exit against hold vote when equity position is down ≥ 0.5%

health_reporter:
  enabled: true
  window_hours: 6              # how far back each report looks AND how long the service sleeps between runs
  output_dir: /data/reports/health          # JSON + TXT files written here: health_YYYY-MM-DD_HH.{json,txt}
  trader_metrics_url: http://trader:8001/metrics  # Prometheus scrape endpoint for win rates, equity, rejects
  compose_project: fricktrade  # Docker Compose project name used to discover all service containers for log scanning
  checkpoint_path: /data/checkpoints/trader.json  # trader state snapshot; used for active positions + dust count
  meta_orch_dir: /data/reports/meta_orch          # last_result.json (health grade) + changes.jsonl (applied changes)
  decision_trace_dir: /data/reports/decision_trace  # JSONL per-day decision records; used for window-scoped trade counts

tactical_meta_orchestrator:
  enabled: false
  interval_minutes: 15          # run every 15 minutes
  apply_delay_minutes: 5        # delay before applying weights / stop / TP changes
  param_change_cooldown_minutes: 60  # min interval between changes to the same parameter (prevents oscillation)
  backend: gemini
  model: gemini-2.5-flash
  session_reports_dir: /data/reports/session   # PostSessionAnalyst output dir
  output_dir: /data/reports/meta_orch          # change log + last_result.json
  bounds:
    # Operational params — applied immediately
    trading_limits.crypto_order_margin:              [0.93, 0.99]
    execution.stuck_cooldown_minutes:                [5, 30]
    execution.insufficient_stablecoin_cooldown_minutes: [2, 15]
    data.timeout_seconds:                            [15, 60]
    # Strategy params — applied after apply_delay_minutes
    strategy.params.exit_vote_threshold:             [1, 3]
    strategy.params.min_hold_minutes:                [5, 30]
    strategy.params.regime_hold_minutes.base_minutes: [60, 480]
    # Risk: equity
    risk.hard_stop_pct:                              [0.5, 3.0]
    risk.trailing_stop_pct:                          [1.5, 10.0]
    risk.take_profit_pct:                            [0.5, 5.0]
    risk.partial_take_profit_pct:                    [0.3, 3.0]
    # Risk: crypto
    risk.crypto.hard_stop_pct:                       [1.5, 6.0]
    risk.crypto.trailing_stop_pct:                   [2.0, 10.0]
    risk.crypto.take_profit_pct:                     [2.0, 8.0]
    # LLM orchestrator
    llm_orchestrator.price_invalidation_pct:         [0.005, 0.03]
    llm_orchestrator.exit_drawdown_pct_crypto:       [0.5, 5.0]
    llm_orchestrator.exit_drawdown_pct_equity:       [0.2, 2.0]
    # Strategy weight bounds
    strategy_weight_min: 0.03
    strategy_weight_max: 0.45

strategic_meta_orchestrator:
  enabled: false
  weekly_day: 6                 # 0=Mon … 6=Sun — runs Sunday
  weekly_hour_utc: 6            # 06:00 UTC
  emergency_threshold: 3        # trigger after 3 consecutive D/F session grades
  min_reports: 3                # minimum reports needed before running
  apply_delay_hours: 1          # 1-hour delay before baseline weight changes take effect
  auto_apply: true
  backend: gemini
  model: gemini-2.5-flash
  session_reports_dir: /data/reports/session
  output_dir: /data/reports/meta_orch
  tactical_changes_log: /data/reports/meta_orch/changes.jsonl
  bounds:
    # Same tunable params as tactical layer
    trading_limits.crypto_order_margin:              [0.93, 0.99]
    execution.stuck_cooldown_minutes:                [5, 30]
    execution.insufficient_stablecoin_cooldown_minutes: [2, 15]
    data.timeout_seconds:                            [15, 60]
    strategy.params.min_hold_minutes:                [5, 30]
    strategy.params.regime_hold_minutes.base_minutes: [60, 480]
    risk.hard_stop_pct:                              [0.5, 3.0]
    risk.trailing_stop_pct:                          [2.0, 10.0]
    risk.take_profit_pct:                            [0.5, 5.0]
    risk.partial_take_profit_pct:                    [0.3, 3.0]
    risk.crypto.hard_stop_pct:                       [1.5, 6.0]
    risk.crypto.trailing_stop_pct:                   [2.0, 10.0]
    risk.crypto.take_profit_pct:                     [2.0, 8.0]
    llm_orchestrator.price_invalidation_pct:         [0.005, 0.03]
    llm_orchestrator.exit_drawdown_pct_crypto:       [0.5, 5.0]
    llm_orchestrator.exit_drawdown_pct_equity:       [0.2, 2.0]
    # Strategy weight bounds
    strategy_weight_min: 0.03
    strategy_weight_max: 0.45
    tactical_corridor_pct: 30   # default corridor width for tactical layer
