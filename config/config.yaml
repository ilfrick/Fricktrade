app:
  name: autotrader
  env: prod
  timezone: Europe/Rome
  log_level: INFO
api:
  auth:
    enabled: false
    token_env: FRICKTRADE_API_TOKEN
logging:
  file_path: /data/logs/trader.log
  max_bytes: 5000000
  backup_count: 5
market:
  venue: Multi
  default_currency: EUR
  default_symbol_venue: NYSE
  symbol_venues: {}
  symbol_currencies: {}
  symbol_sectors: {}
  symbol_venues_auto:
    enabled: true
    refresh_minutes: 1440
    max_symbols: 50000
    exchange_venue_map:
      NYSE: NYSE
      NASDAQ: Nasdaq
      ARCA: NYSE
      AMEX: NYSE
  open_mode: any
  trading_venues:
    - NYSE
    - Nasdaq
    - Crypto
  extended_hours:
    enabled: false
  holiday_update:
    enabled: true
    interval_days: 7
    years_ahead: 1
  venues:
  - name: Crypto
    timezone: UTC
    trading_hours:
      open: "00:00"
      close: "23:59"
    holidays: []
  - name: BorsaItaliana
    timezone: Europe/Rome
    trading_hours:
      open: 09:00
      close: '17:30'
    holidays:
    - '2026-01-01'
    - '2026-01-06'
    - '2026-04-03'
    - '2026-04-05'
    - '2026-04-06'
    - '2026-04-25'
    - '2026-05-01'
    - '2026-05-25'
    - '2026-06-02'
    - '2026-08-15'
    - '2026-10-04'
    - '2026-11-01'
    - '2026-12-08'
    - '2026-12-25'
    - '2026-12-26'
    - '2027-01-01'
    - '2027-01-06'
    - '2027-03-26'
    - '2027-03-28'
    - '2027-03-29'
    - '2027-04-25'
    - '2027-05-01'
    - '2027-05-17'
    - '2027-06-02'
    - '2027-08-15'
    - '2027-10-04'
    - '2027-11-01'
    - '2027-12-08'
    - '2027-12-25'
    - '2027-12-26'
  - name: NYSE
    timezone: America/New_York
    trading_hours:
      open: 09:30
      close: '16:00'
      extended_open: 04:00
      extended_close: '20:00'
    holidays:
    - '2026-01-01'
    - '2026-01-19'
    - '2026-02-16'
    - '2026-04-03'
    - '2026-05-25'
    - '2026-06-19'
    - '2026-09-07'
    - '2027-01-01'
    - '2027-01-18'
    - '2027-02-15'
    - '2027-03-26'
    - '2027-05-31'
    - '2027-09-06'
  - name: Nasdaq
    timezone: America/New_York
    trading_hours:
      open: 09:30
      close: '16:00'
      extended_open: 04:00
      extended_close: '20:00'
    holidays:
    - '2026-01-01'
    - '2026-01-19'
    - '2026-02-16'
    - '2026-04-03'
    - '2026-05-25'
    - '2026-06-19'
    - '2026-07-03'
    - '2026-09-07'
    - '2026-11-26'
    - '2026-12-25'
  asset_classes:
    equities:
      venues: [NYSE, Nasdaq]
      min_price: 2.0
      order_types: [market, limit, stop, stop_limit]
      time_in_force: [day, gtc, ioc]
      shortable: true
      marginable: true
    crypto:
      venues: [Crypto]
      min_price: 0.0
      order_types: [market, limit, stop_limit]
      time_in_force: [gtc, ioc]
      shortable: false
      marginable: false
brokers:
  alpaca:
    enabled: true
    base_url: https://paper-api.alpaca.markets
    api_key: ${ALPACA_API_KEY}
    api_secret: ${ALPACA_API_SECRET}
    accounts:
    - name: Realistic
      risk:
        trailing_stop_pct: 0.5
        hard_stop_pct: 1.0
      reward:
        time_penalty_weight: 0.8
        time_normalizer: 240.0
    - name: Higher
    fees:
      commission_pct: 0.0
      per_trade_fee: 0.0
      per_share_fee: 0.0
      min_fee: 0.0
      spread_pct: 0.0
  binance:
    enabled: true
    futures: true                                   # use Futures (FAPI) endpoints
    base_url: ${BINANCE_BASE_URL}                   # demo: https://demo-fapi.binance.com; blank = live
    testnet: false
    api_key: ${BINANCE_API_KEY}
    api_secret: ${BINANCE_API_SECRET}
    accounts: []             # optional: named sub-accounts (same structure as alpaca.accounts)
    fees:
      commission_pct: 0.05  # 0.05% standard futures taker; 0.02% maker
      per_trade_fee: 0.0
      per_share_fee: 0.0
      min_fee: 0.0
      spread_pct: 0.0
  ibkr:
    enabled: false
    host: 127.0.0.1
    port: 7497
    client_id: 1
    account_id: ''
    currency: ${IBKR_CURRENCY}
    accounts: []
    fees:
      commission_pct: 0.0
      per_trade_fee: 0.0
      per_share_fee: 0.0
      min_fee: 0.0
      spread_pct: 0.0
risk:
  enabled: true
  max_daily_loss_pct: 3.0
  crypto:
    max_daily_loss_pct: 5.0
    max_position_size_pct: 90.0
    max_crypto_exposure_pct: 50.0
    hard_stop_pct: 3.0
    trailing_stop_pct: 5.0
    take_profit_pct: 4.0
    circuit_breaker_drawdown_pct: 8.0
    vol_targeting:
      target_vol_pct: 4.0
  max_position_size_pct: 90.0
  max_portfolio_leverage: 1.5
  max_short_exposure_pct: 30.0
  max_positions: 30
  cooldown_seconds: 5
  hard_stop_pct: 0.8
  trailing_stop_pct: 5.0
  circuit_breaker_drawdown_pct: 5.0
  take_profit_pct: 1.5
  partial_take_profit_pct: 1.0
  partial_take_profit_ratio: 0.5
  vol_targeting:
    enabled: true
    target_vol_pct: 2.0
    min_scale: 0.5
    max_scale: 1.5
  stress:
    enabled: false
    shock_pct: 5.0
  liquidity_haircut:
    enabled: false
    max_participation: 0.1
    min_session_volume: 100000
    max_spread_pct: 1.0
    volume_haircut_pct: 50.0
  var:
    enabled: true
    window: 60
    confidence: 0.95
    max_var_pct: 4.0
    max_cvar_pct: 6.0
  exposure_caps:
    enabled: true
    venues:
      NYSE: 60.0      # max 60% in NYSE-listed equities
      Nasdaq: 60.0    # max 60% in Nasdaq-listed equities
      Crypto: 50.0    # max 50% in crypto (also enforced by risk.crypto)
    sectors:
      Technology: 35.0
      Healthcare: 25.0
      Financials: 25.0
      Energy: 20.0
      Consumer Discretionary: 20.0
  pdt:
    force_swing: true        # hold overnight instead of triggering PDT violation
    equity_threshold: 2500   # accounts below this are PDT-restricted (Alpaca threshold)
    daytrade_count_limit: 3  # block exit when rolling 5-day day-trade count >= this
  kill_switch_profiles:
    enabled: false
    mode: static
    current: medium
    adaptive:
      low_vol_max_pct: 1.0
      high_vol_min_pct: 3.0
    profiles:
      low:
        max_daily_loss_pct: 1.0
        circuit_breaker_drawdown_pct: 4.0
      medium:
        max_daily_loss_pct: 2.0
        circuit_breaker_drawdown_pct: 6.0
      high:
        max_daily_loss_pct: 3.0
        circuit_breaker_drawdown_pct: 8.0
trading_limits:
  enabled: true
  allow_shorts: false
  enforce_account_flags: true
  blocked_symbols: []
  blocked_actions: []
  min_price: 2.0
  fractional_shares: true   # enable fractional qty for crypto (always) and equities
  min_notional: 10.0         # minimum USD order value; Alpaca crypto minimum is $10
strategy:
  name: trend_following
  names:
  - trend_following
  - factor_model
  - pattern_trading
  - stat_arb_pairs
  - top_movers_rf
  - crypto_momentum
  - crypto_mean_reversion
  - gap_reversal
  - earnings_drift
  combine: vote
  min_conviction: 0.12
  single_sided_conviction_multiplier: 0.4
  fee_aware:
    min_edge_pct: 0.005
    edge_multiplier: 0.5
    min_notional: 50.0
  signal_bias_guard:
    enabled: true
    threshold: 0.65
  performance:
    enabled: true
    window_days: 30
    min_trades: 20
    min_win_rate: 0.4
    max_drawdown_pct: 12.0
    report_interval_minutes: 10
    report_path: /data/reports/strategy_performance.json
    kill_switch:
      enabled: true
  params:
    lookback_minutes: 10
    entry_threshold_pct: 0.5
    exit_threshold_pct: 0.15
    position_horizon_minutes: 20
    allow_shorts: true
    trend_following:
      fast_window: 10
      slow_window: 30
      breakout_pct: 0.3
      exit_pct: 0.15
      # enabled: false   # uncomment to disable this strategy without restart
      min_conviction_by_regime:
        low_vol_trending: 0.25   # lower bar — strong trending conditions
        high_vol_crisis: 0.50    # higher bar — trend signals unreliable in crisis
    factor_model:
      momentum_weight: 0.5
      liquidity_weight: 0.2
      volatility_weight: 0.1
      mr_weight: 0.15
      buy_threshold: 0.2
      sell_threshold: -0.2
    stat_arb_pairs:
      lookback: 50
      z_entry: 1.5
      z_exit: 0.5
      refresh_minutes: 30
      max_pairs: 25
      min_conviction_by_regime:
        high_vol_crisis: 0.20    # stat_arb thrives in crisis — lower bar
    market_maker:
      base_spread_pct: 0.4
      inventory_target_pct: 0.0
      skew_pct: 0.15
      min_qty: 1
    crypto_momentum:
      fast_window: 5
      medium_window: 15
      slow_window: 60
      volume_mult: 2.0
      min_return_pct: 0.3
      trailing_stop_pct: 2.0
    crypto_mean_reversion:
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 25.0
      drop_window_bars: 15
      hard_stop_pct: 3.0
    gap_reversal:
      min_gap_pct: 2.0
      target_fill_pct: 50.0
      stop_pct: 0.5
      volume_confirm_mult: 2.0
      max_trade_window_minutes: 60
      rsi_period: 5
      rsi_oversold: 30.0
      rsi_overbought: 70.0
    earnings_drift:
      min_gap_pct: 5.0
      min_volume_mult: 1.5
      hold_days: 20
      trailing_stop_pct: 4.0
    top_movers_rf:
      data_dir: /data
      model_path: /data/models/top_movers_rf/top_movers_rf.pkl
      auto_train_on_start: true
      retrain_if_older_hours: 24
      min_training_days: 5
      min_bars: 60
      top_n: 10
      runtime_interval: 5m
      training_interval: 5m
      cutoff_minutes: 30
      entry_warmup_minutes: 20
      entry_horizon_minutes: 90
      low_zone_tol_pct: 0.35
      rebound_target_pct: 2.0
      buy_nowcast_min: 0.50
      buy_entry_min: 0.50
      buy_score_min: 0.54
      exit_score_max: 0.40
      exit_pullback_from_high_pct: 1.2
      nowcast_weight: 0.65
      entry_weight: 0.35
      respect_account_blocks: true
      respect_pdt_soft_block: true
      pdt_daytrade_limit: 3
      pdt_min_equity: 25000
      min_buying_power: 50
orchestrator:
  mode: weight
  top_k: 3
  min_score: 0.0
  strategy_weights:
    trend_following: 0.18
    factor_model: 0.14
    pattern_trading: 0.20
    stat_arb_pairs: 0.06
    top_movers_rf: 0.42
  rl:
    enabled: false
    model_type: lstm
    device: auto
    hidden_dim: 32
    dropout: 0.1
    num_layers: 1
    seq_len: 10
    model_path: /data/orchestrator_model.pt
    best_model_path: /data/orchestrator_model_best.pt
    use_best_model: true
    best_score_path: /data/orchestrator_model_best_score.json
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 64
    buffer_size: 5000
    update_steps_per_bar: 1
    epsilon: 0.2
    min_price_move_pct: 0.02
    reward_mode: policy
    reward_scale: 1.0
    entropy_coef: 0.01
    baseline_alpha: 0.1
    max_grad_norm: 1.0
    save_interval_seconds: 60
    score_ema_alpha: 0.1
    time_penalty_per_bar: 0.15
    global_time_penalty:
      enabled: true
      max_idle_minutes: 15.0
      penalty_scale: 0.03
      penalty_type: exponential
    pretrain:
      enabled: true
      in_trader: false
      provider: alpaca
      alpaca_api_key: ${ALPACA_API_KEY}
      alpaca_api_secret: ${ALPACA_API_SECRET}
      lookback_days: 60
      interval: 5m
      window_days: 60
      coverage_days: 365
      step_days: 30
      max_symbols: 100
      max_samples: 8000
      epochs: 3
      warmup_bars: 50
      symbols_source: alpaca_active_random
      timeout_seconds: 15
      retries: 2
learning:
  enabled: true
  model_path: /app/models/ppo_policy.zip
  best_model_path: /app/models/ppo_policy_best.zip
  use_best_model: false
  device: auto
  window_size: 50
  reward:
    nav_weight: 1.0
    time_penalty_weight: 1.5
    profit_bonus_weight: 3.0
    velocity_weight: 0.3
    nav_normalizer: 100000.0
    time_normalizer: 120.0
    velocity_window: 20
    bar_interval_minutes: 5.0
  live_rewards:
    enabled: true
    path: /data/learning/live_rewards.jsonl
    positions_path: /data/learning/live_positions.json
    max_days: 7
    mode: add
    reward_pnl_mode: pct
    reward_pnl_scale: 1.0
  features:
    include_returns: true
    include_signal_features: true
    include_extended_indicators: true
    include_regime_features: true
    include_mtf_features: true
    signal_interval: 5m
    sma_periods:
    - 5
    - 20
    ema_periods:
    - 10
    rsi_periods:
    - 14
    adx_periods:
    - 14
    trend_strength_periods:
    - 14
  registry:
    enabled: true
    path: /app/models/model_registry.json
    artifact_dir: /app/models/registry
    artifact_prefix: ppo_policy
    active_path: /app/models/model_active.json
    use_active: true
    publish_mode: latest
    refresh_minutes: 5
  drift:
    enabled: false
    window: 120
    feature_zscore_threshold: 3.0
    max_drift_feature_pct: 0.3
    pnl_window: 30
    max_pnl_drop_pct: 2.0
    auto_rollback: true
    baseline_enabled: true
    baseline_max_samples: 5000
    baseline_stride: 5
  guardrail:
    enabled: true
    mode: confirm
    params:
      lookback_minutes: 30
      entry_threshold_pct: 0.8
      exit_threshold_pct: 0.2
    allow_shorts: false
  online:
    enabled: true
    update_interval_minutes: 60
    timesteps: 1000
    eval_split: 0.1
    respect_ops_state: true
    use_live_rewards: true
  training:
    data_dir: /data/rl_train_small
    interval: 5m
    timesteps: 50000
    checkpoint_best_only: false
    use_live_rewards: false
    initial_cash: 200
    commission_pct: 0.05
    slippage_bps: 2
    eval_split: 0.2
    resume: false
    report_path: /app/models/training_report.json
    best_report_path: /app/models/training_report_best.json
    report_plot_dir: /app/models/reports
  # TCN (Temporal Convolutional Network) feature extractor config
  tcn:
    enabled: true
    features_dim: 64
    num_layers: 3
    kernel_size: 3
    dropout: 0.1
    net_arch:
      pi: [64, 64]
      vf: [64, 64]
  # Regime detection (HMM-based)
  regime:
    enabled: true
    n_regimes: 3
    lookback: 100
    vol_window: 20
    skew_window: 20
# Portfolio optimization
portfolio:
  enabled: true
  method: risk_parity
  risk_model:
    method: ledoit_wolf
    window: 60
  constraints:
    max_position_pct: 0.90
    min_position_pct: 0.01
    max_sector_pct: 0.40
  rebalance:
    enabled: true
    drift_threshold_pct: 5.0
    min_trade_pct: 0.5
    min_interval_minutes: 60
backtest:
  data_dir: /data
  start: '2025-11-20'
  end: '2026-02-13'
  initial_cash: 100000
  symbols:
    - AAPL
    - MSFT
    - NVDA
    - GOOGL
    - AMZN
    - META
    - TSLA
    - JPM
    - V
    - UNH
    - HD
    - PG
    - JNJ
    - BAC
    - XOM
    - COST
    - AMD
    - CRM
    - NFLX
    - INTC
  commission_pct: 0.05
  slippage_bps: 2
  spread_bps: 0
  use_gpu: true
  mode: agent
  symbols_source: config
  cache:
    enabled: true
    format: npz
    dir: /data/backtest_cache
    compress: false
  dynamic_symbols_enabled: true
  news_enabled: false
  news_source: none
  news_path: /data/news_cache.json
  run_when_closed: true
  plan:
    enabled: false
    window_days: 60
    step_days: 30
    liquidity_tiers: 3
    sample_per_tier: 50
    seed: 42
benchmarking:
  run_when_closed: false
  use_plan: true
  plan_window_days: 60
  plan_step_days: 30
  plan_liquidity_tiers: 3
  plan_sample_per_tier: 10
  bootstrap_samples: 500
  bootstrap_confidence: 0.95
  seed: 42
  mc:
    enabled: true
    runs: 10
    slippage_bps_range:
    - 2
    - 10
    spread_bps_range:
    - 0
    - 8
    commission_pct_range:
    - 0.02
    - 0.2
  output_path: /data/reports/benchmark_report.json
  plot_dir: /data/reports/benchmark_plots
  pdf_path: /data/reports/benchmark_report.pdf
data:
  provider: alpaca
  prefetch_enabled: true
  prefetch_after_filter: false
  process_on_new_bar_only: false
  symbols: []
  interval: 5m
  lookback_days: 7
  session_gain_mode: gap
  quality:
    enabled: true
    report_path: /data/reports/data_quality.json
    gap_multiplier: 3
    outlier_zscore: 6
  adjustments:
    enabled: false
    dir: /data/adjustments
  dynamic_symbols:
    enabled: true
    provider: alpaca
    feed: iex
    refresh_minutes: 1
    max_symbols: 150       # cap total active universe; splits proportionally across accounts
    max_universe: 1000
    universe: alpaca_active_all  # equities + crypto; derived live from Alpaca account assets
    crypto_quote_currencies: [USD]  # only trade crypto pairs quoted in USD; add USDC/USDT if you hold stablecoin balances
    universe_price_filter: true
    cash_aware: true
    cash_buffer_pct: 95
    cash_cap_mode: cash
    cash_max_pct: 100
    timeout_seconds: 30    # 30s avoids retry on 33-symbol crypto bulk-fetch (was 10s, causing ~29s latency on retry)
    retries: 2
    ai_filter:
      enabled: true
      provider: yfinance
      coverage_filter: true
      use_cached_symbols: false
      interval: 5m
      lookback_days: 2
      window: 20
      retrain_hours: 6
      max_inflight_seconds: 600
      model_type: ppo
      model_path: /data/ai_symbol_filter.zip
      train_max_symbols: 100
      max_samples_per_symbol: 200
      rl:
        timesteps: 2000
        learning_rate: 0.0003
        batch_size: 64
        n_steps: 64
        gamma: 0.99
        ent_coef: 0.01
        clip_range: 0.2
        gae_lambda: 0.95
      online:
        enabled: true
        learning_rate: 0.001
        steps: 10
        timesteps: 256
        max_symbols: 500
      news:
        enabled: true
        provider: alpaca
        base_url: https://data.alpaca.markets
        lookback_hours: 12
        keywords: []
        timeout_seconds: 10
        retries: 2
      timeout_seconds: 15
      retries: 2
      feed: iex
      objective: return_time_penalty
      time_penalty_per_bar: 0.15
      allow_orchestrator_fetch: false
      keras_returns:
        enabled: true
        model_path: /app/models/keras/stocks_price_regression_128_60-60m_5minc_best.keras
        interval: 5m
        score_mode: expected_return
        weight: 0.5
      # Return ranker: sklearn GBM trained on collected 5m bar data.
      # Set enabled: true after 5+ sessions of training data are collected.
      # When enabled, replaces keras_returns as the per-symbol overlay scorer.
      return_ranker:
        enabled: true
        model_path: /data/return_ranker.pkl
        data_dir: /data/training
        retrain_hours: 24
        max_age_days: 3
    filters:
      price_min: 2.0
      relative_volume_min: 2.0
      premarket_gain_min_pct: 1.0
      min_shares_traded: 500000
      max_spread_pct: 0.3
      strict_spread: true
      require_catalyst: false
    fallback:
      enabled: true
      relative_volume_min: 0.0
      premarket_gain_min_pct: 0.0
      min_shares_traded: 100000
      max_spread_pct: 2.0
      require_catalyst: false
  start: ''
  end: ''
  proxy: ''
  rate_limit_seconds: 2
  output_dir: /data
  sources:
  - provider: yfinance
    enabled: true
    symbols: []
    interval: 5m
    lookback_days: 7
    rate_limit_seconds: 2
    symbol_blacklist: []
  - provider: alpaca
    enabled: true
    symbols: []
    universe: alpaca_active
    max_universe: 10000
    interval: 5m
    start: '2025-10-23'
    end: '2025-12-22'
    rate_limit_seconds: 1
  - provider: stooq
    enabled: false
    symbols:
    - eni
    - pkn
    interval: 5m
    rate_limit_seconds: 2
  - provider: alphavantage
    enabled: false
    api_key: ${ALPHAVANTAGE_API_KEY}
    symbols: []
market_cache:
  enabled: true
  redis_url: redis://redis:6379/0
  file_dir: /data/market_cache
  batch_size: 50
  delay_seconds: 3.0
  max_age_multiplier: 3  # 5m * 3 = 15 min TTL (Alpaca data is more timely)
  cache_only: false
  ignore_staleness: false
  allow_pickle: false
  filtered_symbols:
    enabled: true
checkpointing:
  enabled: true
  interval_seconds: 60
  dir: /data/checkpoints
  keep_history: true
  retention:
    max_age_hours: 72
    max_files: 200
healthwatch:
  enabled: true
  interval_seconds: 30
  timeout_seconds: 30
  port: 9105
  targets:
    trader: http://trader:8001/metrics
    api: http://api:8000/health
    prometheus: http://prometheus:9090/-/healthy
    grafana: http://grafana:3000/api/health
    alertmanager: http://alertmanager:9093/-/healthy
  market_shutdown:
    enabled: true
    mode: partial  # 'full' stops trader; 'partial' keeps it running for crypto 24/7
    project_name: fricktrade
    check_interval_seconds: 60
    start_before_minutes: 15
    heartbeat_minutes: 15
    write_state: true
    state_path: /data/system_state.json
    keep_services:
    - healthwatch
    - autoheal
    - docker-socket-proxy
    - daily-report
    - prometheus
    - tests-when-closed
    - trader          # Always on — crypto trades 24/7
    - api             # Always on — monitoring
    - market-cache    # Always on — crypto data
    - redis           # Always on — cache backend
    - learner         # Always on — crypto data trains 24/7
    - grafana         # Always on — 24/7 monitoring
    - alertmanager    # Always on — 24/7 alerts
    stop_services:
    - ollama          # Shut down outside equity hours (saves GPU)
kill_switch:
  armed: false
  confirm_code: ''
  required_code: ${KILL_SWITCH_CODE}
  confirm_phrase: 'YES'
  force_sleep: false
  force_liquidate: false
reports:
  daily_top_movers:
    enabled: true
    top_n: 10
    universe: alpaca_active
    max_universe: 5000
    feed: iex
    output_dir: /data/reports/daily_top_movers
    training_enabled: true
    training_data_dir: /data
    check_interval_seconds: 60
    close_delay_minutes: 5
    broker_venues: {}
    use_symbol_venues_auto: true
    prometheus_url: http://prometheus:9090
    signal_thresholds:
      early_return_30m_pct: 1.5
      sustained_return_60m_pct: 2.5
      early_volume_pct: 20.0
      runup_pct: 4.0
      drawdown_pct: -2.0
    news:
      enabled: true
      provider: alpaca
      max_headlines: 8
      include_summaries: false
      correlation_window_minutes: 90
    decision_trace:
      enabled: true
      output_dir: /data/reports/decision_trace
    explain_ai:
      enabled: true
      provider: ollama
      base_url: http://ollama:11434
      model: llama3.2:3b  # Smaller model to avoid GPU OOM
      timeout_seconds: 60
      max_text_chars: 800
    email:
      use_alertmanager_config: true
      alertmanager_config_path: /app/alertmanager/alertmanager.yml
      smtp_require_tls: true
news:
  enabled: true
  provider: alpaca
  base_url: https://data.alpaca.markets
  api_key: ${ALPACA_API_KEY}
  api_secret: ${ALPACA_API_SECRET}
  lookback_hours: 12
  cache_minutes: 1
  keywords: []
  timeout_seconds: 10
  retries: 2
  llm:
    enabled: true
    provider: ollama
    base_url: http://ollama:11434
    model: llama3.2:3b  # Smaller model to avoid GPU OOM
    timeout_seconds: 120  # CPU mode is slow, needs longer timeout
    max_items: 25
    max_text_chars: 800
pattern_trading:
  selection:
    price_min: 2.0
    relative_volume_min: 1.0
    premarket_gain_min_pct: 1.0
    min_shares_traded: 100000
    max_spread_pct: 1.0
    strict_spread: false
    require_catalyst: false
  pattern:
    ma_periods:
    - 9
    - 20
    pullback_max_retrace_pct: 50
  entry:
    breakout_lookback_bars: 20
    volume_confirm_mult: 1.5
  risk:
    stop_loss_pct: 0.05
    partial_take_profit_pct: 0.1
    trailing_stop_pct: 0.02
execution:
  symbol_executor_workers: 4
  limit_orders:
    enabled: true             # Use limit orders by default; market orders only for high urgency
    default_offset_bps: 3.0   # Fallback offset when spread_pct unavailable (3 bps)
    high_urgency_threshold: 0.8  # calibrated_confidence > this → market order
  open_orders:
    enabled: true
    interval_seconds: 30
    skip_if_pending: true
    missing_grace_seconds: 30
  algos:
    enabled: true
    default: twap
    min_notional: 500.0
    adaptive:
      enabled: true
      impact_bps_thresholds:
        vwap: 4
        pov: 8
    twap:
      duration_seconds: 120
      slices: 4
    vwap:
      duration_seconds: 120
      profile:
      - 1
      - 1
      - 1
      - 1
    pov:
      max_participation: 0.1
      estimated_volume: 100000
  impact:
    base_bps: 1.0
    volume_scale_bps: 50.0
    min_vol_pct: 0.5
  retry:
    enabled: true
    max_attempts: 2
    backoff_seconds: 10
    max_notional: 5000
    max_order_age_seconds: 300   # Cancel + unblock queue if order stuck > 5 min
    reasons:
    - unknown
    - insufficient_funds
  brokers:
    enabled: true
    routing:
      mode: parallel
      buying_power_scaling: false  # fractional: _size_order already scales by equity; both accounts evaluate full universe
      default: alpaca
      symbols: {}
      strategies: {}
      fallback_enabled: false
llm:
  enabled: true  # Master switch — requires ANTHROPIC_API_KEY and GOOGLE_GEMINI_API_KEY in .env

  # Backend assignment per module
  backends:
    sentiment: claude        # Quality-critical
    symbols_filter: gemini   # High volume, large context
    post_session: gemini     # Large trade logs
    meta_orchestrator: claude # Complex reasoning
    risk_interpreter: claude  # Safety-critical

  # Macro regime analyzer (Claude) — fetches FRED data + calls LLM every 4h
  macro_regime:
    enabled: true
    refresh_hours: 4
    backend: claude

  # Sentiment analyzer (Claude) — per-symbol news analysis
  # Fires only when news.enabled: true AND raw articles are fetched from Alpaca
  sentiment:
    enabled: true
    cache_ttl_seconds: 900
    max_news_items: 10
    min_confidence_to_inject: 0.3

  # Daily symbol selection (Gemini) — replaces PPO filter
  symbols_filter:
    enabled: false           # Enable manually; runs pre-market, overrides AI filter
    run_time: pre_market   # pre_market | manual
    select_count: 30
    fallback_to_rules: true  # Use rule-based filter if LLM fails
    crypto_refresh_hours: 4  # Re-run filter for crypto symbols every N hours (24/7)

  # Post-session analyst (Gemini) — automated daily review
  post_session:
    enabled: true
    auto_run: true           # Run automatically at session end
    output_dir: data/session_reports
    max_trades_in_context: 100
    auto_apply_weights: false  # If true, apply weight changes without confirmation

  # Meta-orchestrator (Claude) — weekly weight rebalancing
  meta_orchestrator:
    enabled: false
    run_day: sunday          # Day of week for weekly review
    auto_apply: false        # Require human confirmation
    max_weight_change: 0.15  # Max change per strategy per week
    min_sessions_required: 3 # Minimum sessions before adjusting

  # Risk event interpreter (Claude) — replaces simple auto-rollback
  risk_interpreter:
    enabled: true
    min_severity: medium     # Interpret medium/high/critical alerts
    timeout_seconds: 15      # Max wait for LLM response

  # Cost management
  cost:
    daily_budget_usd: 5.00
    alert_threshold_usd: 4.00
    log_all_costs: true

monitoring:
  prometheus_port: 8001
  metrics_path: /metrics
  audit:
    enabled: false
    output_dir: /data/reports/audit
    include_features: true
    include_market_state: false
    retention_days: 30
    enforce_reason_codes: false
    reason_codes_path: /app/config/reason_codes.json
    signing:
      enabled: false
      secret_env: AUDIT_SIGNING_SECRET
  compliance:
    enabled: false
    output_dir: /data/reports/compliance
    formats:
