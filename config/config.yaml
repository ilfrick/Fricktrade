    include_features: false
    include_market_state: false
    retention_days: 30
    enforce_reason_codes: false
    reason_codes_path: /app/config/reason_codes.json
    signing:
      enabled: false
      secret_env: COMPLIANCE_SIGNING_SECRET
alt_data:
  fear_greed:
    enabled: true
  coinglass:
