app:
  name: autotrader
  env: prod
  timezone: Europe/Rome
  log_level: INFO
api:
  auth:
    enabled: false
    token_env: FRICKTRADE_API_TOKEN
logging:
  file_path: /data/logs/trader.log
  max_bytes: 5000000
  backup_count: 5
market:
  venue: Multi
  default_currency: EUR
  default_symbol_venue: NYSE
  symbol_venues: {}
  symbol_currencies: {}
  symbol_sectors: {}
  symbol_venues_auto:
    enabled: true
    refresh_minutes: 1440
    max_symbols: 50000
    exchange_venue_map:
      NYSE: NYSE
      NASDAQ: Nasdaq
      ARCA: NYSE
      AMEX: NYSE
  open_mode: any
  extended_hours:
    enabled: false
  holiday_update:
    enabled: true
    interval_days: 7
    years_ahead: 1
  venues:
  - name: BorsaItaliana
    timezone: Europe/Rome
    trading_hours:
      open: 09:00
      close: '17:30'
    holidays:
    - '2026-01-01'
    - '2026-01-06'
    - '2026-04-03'
    - '2026-04-05'
    - '2026-04-06'
    - '2026-04-25'
    - '2026-05-01'
    - '2026-05-25'
    - '2026-06-02'
    - '2026-08-15'
    - '2026-10-04'
    - '2026-11-01'
    - '2026-12-08'
    - '2026-12-25'
    - '2026-12-26'
    - '2027-01-01'
    - '2027-01-06'
    - '2027-03-26'
    - '2027-03-28'
    - '2027-03-29'
    - '2027-04-25'
    - '2027-05-01'
    - '2027-05-17'
    - '2027-06-02'
    - '2027-08-15'
    - '2027-10-04'
    - '2027-11-01'
    - '2027-12-08'
    - '2027-12-25'
    - '2027-12-26'
  - name: NYSE
    timezone: America/New_York
    trading_hours:
      open: 09:30
      close: '16:00'
      extended_open: 04:00
      extended_close: '20:00'
    holidays:
    - '2026-01-01'
    - '2026-01-19'
    - '2026-02-16'
    - '2026-04-03'
    - '2026-05-25'
    - '2026-06-19'
    - '2026-09-07'
    - '2027-01-01'
    - '2027-01-18'
    - '2027-02-15'
    - '2027-03-26'
    - '2027-05-31'
    - '2027-09-06'
  - name: Nasdaq
    timezone: America/New_York
    trading_hours:
      open: 09:30
      close: '16:00'
      extended_open: 04:00
      extended_close: '20:00'
    holidays:
    - '2026-01-01'
    - '2026-01-19'
    - '2026-02-16'
    - '2026-04-03'
    - '2026-05-25'
    - '2026-06-19'
    - '2026-07-03'
    - '2026-09-07'
    - '2026-11-26'
    - '2026-12-25'
brokers:
  alpaca:
    enabled: true
    base_url: https://paper-api.alpaca.markets
    api_key: ${ALPACA_API_KEY}
    api_secret: ${ALPACA_API_SECRET}
    accounts:
    - name: Realistic
      risk:
        trailing_stop_pct: 0.5
        hard_stop_pct: 1.0
      reward:
        time_penalty_weight: 0.8
        time_normalizer: 240.0
    - name: Higher
    fees:
      commission_pct: 0.0
      per_trade_fee: 0.0
      per_share_fee: 0.0
      min_fee: 0.0
      spread_pct: 0.0
  ibkr:
    enabled: false
    host: 127.0.0.1
    port: 7497
    client_id: 1
    account_id: ''
    currency: ${IBKR_CURRENCY}
    accounts: []
    fees:
      commission_pct: 0.0
      per_trade_fee: 0.0
      per_share_fee: 0.0
      min_fee: 0.0
      spread_pct: 0.0
risk:
  enabled: true
  max_daily_loss_pct: 1.0
  max_position_size_pct: 10.0
  max_portfolio_leverage: 1.5
  max_short_exposure_pct: 30.0
  max_positions: 30
  cooldown_seconds: 5
  hard_stop_pct: 0.8
  trailing_stop_pct: 0.35
  circuit_breaker_drawdown_pct: 3.0
  vol_targeting:
    enabled: true
    target_vol_pct: 2.0
    min_scale: 0.5
    max_scale: 1.5
  stress:
    enabled: false
    shock_pct: 5.0
  liquidity_haircut:
    enabled: false
    max_participation: 0.1
    min_session_volume: 100000
    max_spread_pct: 1.0
    volume_haircut_pct: 50.0
  var:
    enabled: true
    window: 60
    confidence: 0.95
    max_var_pct: 3.0
    max_cvar_pct: 5.0
  exposure_caps:
    enabled: false
    venues: {}
    sectors: {}
  kill_switch_profiles:
    enabled: false
    mode: static
    current: medium
    adaptive:
      low_vol_max_pct: 1.0
      high_vol_min_pct: 3.0
    profiles:
      low:
        max_daily_loss_pct: 1.0
        circuit_breaker_drawdown_pct: 4.0
      medium:
        max_daily_loss_pct: 2.0
        circuit_breaker_drawdown_pct: 6.0
      high:
        max_daily_loss_pct: 3.0
        circuit_breaker_drawdown_pct: 8.0
trading_limits:
  enabled: true
  allow_shorts: false
  enforce_account_flags: true
  blocked_symbols: []
  blocked_actions: []
  min_price: 2.0
strategy:
  name: rl_policy
  names:
  - rl_policy
  - rl_policy_fees
  - trend_following
  combine: vote
  fee_aware:
    min_edge_pct: 0.005
    edge_multiplier: 0.5
    min_notional: 50.0
  signal_bias_guard:
    enabled: true
    threshold: 0.2
  performance:
    enabled: true
    window_days: 30
    min_trades: 20
    min_win_rate: 0.4
    max_drawdown_pct: 12.0
    report_interval_minutes: 10
    report_path: /data/reports/strategy_performance.json
    kill_switch:
      enabled: true
  params:
    lookback_minutes: 10
    entry_threshold_pct: 0.5
    exit_threshold_pct: 0.15
    position_horizon_minutes: 20
    allow_shorts: true
    trend_following:
      fast_window: 10
      slow_window: 30
      breakout_pct: 0.3
      exit_pct: 0.15
    factor_model:
      momentum_weight: 0.6
      liquidity_weight: 0.3
      volatility_weight: 0.1
      buy_threshold: 0.2
      sell_threshold: -0.2
    stat_arb_pairs:
      lookback: 50
      z_entry: 1.5
      z_exit: 0.5
      refresh_minutes: 30
      max_pairs: 25
    market_maker:
      base_spread_pct: 0.4
      inventory_target_pct: 0.0
      skew_pct: 0.15
      min_qty: 1
orchestrator:
  mode: direct
  top_k: 2
  min_score: 0.0
  rl:
    enabled: true
    model_type: lstm
    device: auto
    hidden_dim: 32
    dropout: 0.1
    num_layers: 1
    seq_len: 10
    model_path: /data/orchestrator_model.pt
    best_model_path: /data/orchestrator_model_best.pt
    use_best_model: true
    best_score_path: /data/orchestrator_model_best_score.json
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 64
    buffer_size: 5000
    update_steps_per_bar: 1
    epsilon: 0.2
    min_price_move_pct: 0.02
    reward_mode: policy
    reward_scale: 1.0
    entropy_coef: 0.01
    baseline_alpha: 0.1
    max_grad_norm: 1.0
    save_interval_seconds: 60
    score_ema_alpha: 0.1
    time_penalty_per_bar: 0.15
    global_time_penalty:
      enabled: true
      max_idle_minutes: 15.0
      penalty_scale: 0.03
      penalty_type: exponential
    pretrain:
      enabled: true
      in_trader: false
      provider: alpaca
      alpaca_api_key: ${ALPACA_API_KEY}
      alpaca_api_secret: ${ALPACA_API_SECRET}
      lookback_days: 60
      interval: 5m
      window_days: 60
      coverage_days: 365
      step_days: 30
      max_symbols: 100
      max_samples: 8000
      epochs: 3
      warmup_bars: 50
      symbols_source: alpaca_active_random
      timeout_seconds: 15
      retries: 2
learning:
  enabled: true
  model_path: /app/models/ppo_policy.zip
  best_model_path: /app/models/ppo_policy_best.zip
  use_best_model: false
  device: auto
  window_size: 50
  reward:
    nav_weight: 1.0
    time_penalty_weight: 1.5
    profit_bonus_weight: 3.0
    velocity_weight: 0.3
    nav_normalizer: 100000.0
    time_normalizer: 120.0
    velocity_window: 20
    bar_interval_minutes: 5.0
  live_rewards:
    enabled: true
    path: /data/learning/live_rewards.jsonl
    positions_path: /data/learning/live_positions.json
    max_days: 7
    mode: add
    reward_pnl_mode: pct
    reward_pnl_scale: 1.0
  features:
    include_returns: true
    include_signal_features: true
    include_extended_indicators: true
    include_regime_features: true
    include_mtf_features: true
    signal_interval: 5m
    sma_periods:
    - 5
    - 20
    ema_periods:
    - 10
    rsi_periods:
    - 14
    adx_periods:
    - 14
    trend_strength_periods:
    - 14
  registry:
    enabled: true
    path: /app/models/model_registry.json
    artifact_dir: /app/models/registry
    artifact_prefix: ppo_policy
    active_path: /app/models/model_active.json
    use_active: true
    publish_mode: latest
    refresh_minutes: 5
  drift:
    enabled: false
    window: 120
    feature_zscore_threshold: 3.0
    max_drift_feature_pct: 0.3
    pnl_window: 30
    max_pnl_drop_pct: 2.0
    auto_rollback: true
    baseline_enabled: true
    baseline_max_samples: 5000
    baseline_stride: 5
  guardrail:
    enabled: true
    mode: confirm
    params:
      lookback_minutes: 30
      entry_threshold_pct: 0.8
      exit_threshold_pct: 0.2
    allow_shorts: false
  online:
    enabled: true
    update_interval_minutes: 60
    timesteps: 1000
    eval_split: 0.1
    respect_ops_state: true
    use_live_rewards: true
  training:
    data_dir: /data/rl_train_small
    interval: 5m
    timesteps: 5000
    checkpoint_best_only: false
    use_live_rewards: false
    initial_cash: 200
    commission_pct: 0.05
    slippage_bps: 2
    eval_split: 0.2
    resume: false
    report_path: /app/models/training_report.json
    best_report_path: /app/models/training_report_best.json
    report_plot_dir: /app/models/reports
  # TCN (Temporal Convolutional Network) feature extractor config
  tcn:
    enabled: true
    features_dim: 64
    num_layers: 3
    kernel_size: 3
    dropout: 0.1
    net_arch:
      pi: [64, 64]
      vf: [64, 64]
backtest:
  data_dir: /data
  start: '2025-10-23'
  end: '2025-12-22'
  initial_cash: 200
  commission_pct: 0.05
  slippage_bps: 2
  spread_bps: 0
  use_gpu: true
  mode: agent
  symbols_source: data_dir
  cache:
    enabled: true
    format: npz
    dir: /data/backtest_cache
    compress: false
  dynamic_symbols_enabled: true
  news_enabled: false
  news_source: none
  news_path: /data/news_cache.json
  run_when_closed: true
  plan:
    enabled: false
    window_days: 60
    step_days: 30
    liquidity_tiers: 3
    sample_per_tier: 50
    seed: 42
benchmarking:
  run_when_closed: false
  use_plan: true
  plan_window_days: 60
  plan_step_days: 30
  plan_liquidity_tiers: 3
  plan_sample_per_tier: 10
  bootstrap_samples: 500
  bootstrap_confidence: 0.95
  seed: 42
  mc:
    enabled: true
    runs: 10
    slippage_bps_range:
    - 2
    - 10
    spread_bps_range:
    - 0
    - 8
    commission_pct_range:
    - 0.02
    - 0.2
  output_path: /data/reports/benchmark_report.json
  plot_dir: /data/reports/benchmark_plots
  pdf_path: /data/reports/benchmark_report.pdf
data:
  provider: yfinance
  prefetch_enabled: true
  prefetch_after_filter: false
  process_on_new_bar_only: true
  symbols: []
  interval: 5m
  lookback_days: 7
  session_gain_mode: gap
  quality:
    enabled: true
    report_path: /data/reports/data_quality.json
    gap_multiplier: 3
    outlier_zscore: 6
  adjustments:
    enabled: false
    dir: /data/adjustments
  dynamic_symbols:
    enabled: true
    provider: alpaca
    feed: iex
    refresh_minutes: 1
    max_symbols: 50000
    max_universe: 50000
    universe: alpaca_active
    universe_price_filter: true
    cash_aware: true
    cash_buffer_pct: 95
    cash_cap_mode: cash
    cash_max_pct: 100
    timeout_seconds: 10
    retries: 2
    ai_filter:
      enabled: true
      provider: yfinance
      coverage_filter: true
      use_cached_symbols: false
      interval: 5m
      lookback_days: 2
      window: 20
      retrain_hours: 6
      model_type: ppo
      model_path: /data/ai_symbol_filter.zip
      train_max_symbols: 100
      max_samples_per_symbol: 200
      rl:
        timesteps: 2000
        learning_rate: 0.0003
        batch_size: 64
        n_steps: 64
        gamma: 0.99
        ent_coef: 0.01
        clip_range: 0.2
        gae_lambda: 0.95
      online:
        enabled: true
        learning_rate: 0.001
        steps: 10
        timesteps: 256
        max_symbols: 50000
      news:
        enabled: true
        provider: alpaca
        base_url: https://data.alpaca.markets
        lookback_hours: 12
        keywords: []
        timeout_seconds: 10
        retries: 2
      timeout_seconds: 15
      retries: 2
      feed: iex
      objective: return_time_penalty
      time_penalty_per_bar: 0.15
      allow_orchestrator_fetch: false
      keras_returns:
        enabled: true
        model_path: /app/models/keras/stocks_price_regression_128_60-60m_5minc_best.keras
        interval: 5m
        score_mode: expected_return
        weight: 0.5
    filters:
      price_min: 2.0
      relative_volume_min: 2.0
      premarket_gain_min_pct: 1.0
      min_shares_traded: 500000
      max_spread_pct: 0.3
      strict_spread: true
      require_catalyst: false
    fallback:
      enabled: true
      relative_volume_min: 0.0
      premarket_gain_min_pct: 0.0
      min_shares_traded: 100000
      max_spread_pct: 2.0
      require_catalyst: false
  start: ''
  end: ''
  proxy: ''
  rate_limit_seconds: 2
  output_dir: /data
  sources:
  - provider: yfinance
    enabled: true
    symbols: []
    interval: 5m
    lookback_days: 7
    rate_limit_seconds: 2
    symbol_blacklist: []
  - provider: alpaca
    enabled: true
    symbols: []
    universe: alpaca_active
    max_universe: 10000
    interval: 5m
    start: '2025-10-23'
    end: '2025-12-22'
    rate_limit_seconds: 1
  - provider: stooq
    enabled: false
    symbols:
    - eni
    - pkn
    interval: 5m
    rate_limit_seconds: 2
  - provider: alphavantage
    enabled: false
    api_key: ${ALPHAVANTAGE_API_KEY}
    symbols: []
market_cache:
  enabled: true
  redis_url: redis://redis:6379/0
  file_dir: /data/market_cache
  batch_size: 500
  delay_seconds: 1.0
  max_age_multiplier: 1
  cache_only: true
  ignore_staleness: false
  allow_pickle: false
  filtered_symbols:
    enabled: true
checkpointing:
  enabled: true
  interval_seconds: 60
  dir: /data/checkpoints
  keep_history: true
  retention:
    max_age_hours: 72
    max_files: 200
healthwatch:
  enabled: true
  interval_seconds: 30
  timeout_seconds: 30
  port: 9105
  targets:
    trader: http://trader:8001/metrics
    api: http://api:8000/health
    prometheus: http://prometheus:9090/-/healthy
    grafana: http://grafana:3000/api/health
    alertmanager: http://alertmanager:9093/-/healthy
  market_shutdown:
    enabled: true
    project_name: fricktrade
    check_interval_seconds: 60
    start_before_minutes: 15
    heartbeat_minutes: 15
    write_state: true
    state_path: /data/system_state.json
    keep_services:
    - healthwatch
    - autoheal
    - daily-report
    - prometheus
    - tests-when-closed
    stop_services: []
kill_switch:
  armed: false
  confirm_code: ''
  required_code: ${KILL_SWITCH_CODE}
  confirm_phrase: 'YES'
  force_sleep: false
  force_liquidate: false
reports:
  daily_top_movers:
    enabled: true
    top_n: 10
    universe: alpaca_active
    max_universe: 5000
    feed: iex
    output_dir: /data/reports/daily_top_movers
    training_enabled: true
    training_data_dir: /data
    check_interval_seconds: 60
    close_delay_minutes: 5
    broker_venues: {}
    use_symbol_venues_auto: false
    prometheus_url: http://prometheus:9090
    signal_thresholds:
      early_return_30m_pct: 1.5
      sustained_return_60m_pct: 2.5
      early_volume_pct: 20.0
      runup_pct: 4.0
      drawdown_pct: -2.0
    news:
      enabled: true
      provider: alpaca
      max_headlines: 8
      include_summaries: false
      correlation_window_minutes: 90
    decision_trace:
      enabled: true
      output_dir: /data/reports/decision_trace
    explain_ai:
      enabled: true
      provider: ollama
      base_url: http://ollama:11434
      model: llama3.1:8b
      timeout_seconds: 30
      max_text_chars: 800
    email:
      use_alertmanager_config: true
      alertmanager_config_path: /app/alertmanager/alertmanager.yml
      smtp_require_tls: true
news:
  enabled: true
  provider: alpaca
  base_url: https://data.alpaca.markets
  api_key: ${ALPACA_API_KEY}
  api_secret: ${ALPACA_API_SECRET}
  lookback_hours: 12
  cache_minutes: 1
  keywords: []
  timeout_seconds: 10
  retries: 2
  llm:
    enabled: true
    provider: ollama
    base_url: http://ollama:11434
    model: llama3.1:8b
    timeout_seconds: 60
    max_items: 25
    max_text_chars: 800
pattern_trading:
  selection:
    price_min: 2.0
    relative_volume_min: 1.0
    premarket_gain_min_pct: 1.0
    min_shares_traded: 100000
    max_spread_pct: 1.0
    strict_spread: false
    require_catalyst: false
  pattern:
    ma_periods:
    - 9
    - 20
    pullback_max_retrace_pct: 50
  entry:
    breakout_lookback_bars: 20
    volume_confirm_mult: 1.5
  risk:
    stop_loss_pct: 0.05
    partial_take_profit_pct: 0.1
    trailing_stop_pct: 0.02
execution:
  open_orders:
    enabled: true
    interval_seconds: 30
    skip_if_pending: true
    strategy_guard: true
    missing_grace_seconds: 30
  algos:
    enabled: true
    default: twap
    min_notional: 500.0
    adaptive:
      enabled: true
      impact_bps_thresholds:
        vwap: 4
        pov: 8
    twap:
      duration_seconds: 120
      slices: 4
    vwap:
      duration_seconds: 120
      profile:
      - 1
      - 1
      - 1
      - 1
    pov:
      max_participation: 0.1
      estimated_volume: 100000
  impact:
    base_bps: 1.0
    volume_scale_bps: 50.0
    min_vol_pct: 0.5
  retry:
    enabled: true
    max_attempts: 2
    backoff_seconds: 10
    max_notional: 5000
    reasons:
    - unknown
    - insufficient_funds
  brokers:
    enabled: true
    routing:
      mode: parallel
      buying_power_scaling: true
      default: alpaca
      symbols: {}
      strategies: {}
      fallback_enabled: false
monitoring:
  prometheus_port: 8001
  metrics_path: /metrics
  audit:
    enabled: false
    output_dir: /data/reports/audit
    include_features: true
    include_market_state: false
    retention_days: 30
    enforce_reason_codes: false
    reason_codes_path: /app/config/reason_codes.json
    signing:
      enabled: false
      secret_env: AUDIT_SIGNING_SECRET
  compliance:
    enabled: false
    output_dir: /data/reports/compliance
    formats:
    - jsonl
    - csv
    include_features: false
    include_market_state: false
    retention_days: 30
    enforce_reason_codes: false
    reason_codes_path: /app/config/reason_codes.json
    signing:
      enabled: false
      secret_env: COMPLIANCE_SIGNING_SECRET
